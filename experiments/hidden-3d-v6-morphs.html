<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MakeHuman Morph v6</title><style>*{box-sizing:border-box}body{margin:0;background:#101016;color:#eee;font-family:system-ui;padding:10px}.app{max-width:540px;margin:auto}.stage{height:55vh;min-height:430px;background:#24242d;border:1px solid #3a3a45;border-radius:18px;overflow:hidden;position:relative}.stage canvas{width:100%;height:100%;display:block}.status{position:absolute;left:10px;right:10px;bottom:10px;background:#000d;padding:8px;border-radius:10px;font-size:12px}.panel{margin-top:10px;background:#1b1b22;border:1px solid #33333e;border-radius:16px;padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#bbb}input{width:100%}b{float:right;color:#eee}button{padding:10px;border-radius:10px;border:1px solid #444;background:#292932;color:#eee;font-weight:700}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}h1{font-size:21px;margin:5px 0 10px}.tiny{font-size:11px;color:#999;margin-top:8px;line-height:1.35}@media(max-height:760px){.stage{height:48vh;min-height:340px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div class="app"><h1>MakeHuman Morph v6</h1><div id="stage" class="stage"><div id="status" class="status">Загрузка body mesh и morph targets…</div></div><div class="panel"><div class="buttons"><button data-y="0">Спереди</button><button data-y="-35">¾</button><button data-y="-80">Сбоку</button><button id="reset">Сброс</button></div><div class="grid"><label>Тип фигуры <b id="shapeV">0%</b><input id="shape" type="range" min="0" max="100" value="0"></label><label>Грудь <b id="breastV">0%</b><input id="breast" type="range" min="-100" max="100" value="0"></label><label>Рост* <b id="heightV">100%</b><input id="height" type="range" min="88" max="112" value="100"></label><label>Объём тела* <b id="massV">100%</b><input id="mass" type="range" min="88" max="115" value="100"></label></div><div class="tiny">Первые две крутилки используют настоящие MakeHuman .target. Рост и объём пока оставлены как контрольный технический масштаб — дальше заменим их macro targets.</div></div></div><script type="module">import * as THREE from 'three';import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';const host=document.querySelector('#stage'),status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x24242d);const camera=new THREE.PerspectiveCamera(28,1,.01,100);camera.position.set(0,1.15,5.5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x444455,2.2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,4,4);scene.add(dl);let body,basePos,targetShape,targetBreastUp,targetBreastDown;function resize(){const r=host.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();async function target(url){const txt=await fetch(url).then(r=>{if(!r.ok)throw Error(url);return r.text()});const map=new Map();for(const line of txt.split(/\r?\n/)){const s=line.trim();if(!s||s[0]==='#')continue;const a=s.split(/\s+/);if(a.length>=4)map.set(+a[0],[+a[1],+a[2],+a[3]])}return map}function apply(){if(!body)return;const p=body.geometry.attributes.position.array;p.set(basePos);const sv=+shape.value/100,bv=+breast.value/100;function add(m,w){if(!m||!w)return;for(const [i,d] of m){if(i>=13380)continue;const j=i*3;if(j+2>=p.length)continue;p[j]+=d[0]*w;p[j+1]+=d[1]*w;p[j+2]+=d[2]*w}}add(targetShape,sv);add(bv>=0?targetBreastUp:targetBreastDown,Math.abs(bv));body.geometry.attributes.position.needsUpdate=true;body.geometry.computeVertexNormals();body.scale.set(+mass.value/100,+height.value/100,+mass.value/100);shapeV.textContent=shape.value+'%';breastV.textContent=breast.value+'%';heightV.textContent=height.value+'%';massV.textContent=mass.value+'%'}const shape=document.querySelector('#shape'),breast=document.querySelector('#breast'),height=document.querySelector('#height'),mass=document.querySelector('#mass'),shapeV=document.querySelector('#shapeV'),breastV=document.querySelector('#breastV'),heightV=document.querySelector('#heightV'),massV=document.querySelector('#massV');for(const e of [shape,breast,height,mass])e.oninput=apply;document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{body.rotation.y=THREE.MathUtils.degToRad(+b.dataset.y)});reset.onclick=()=>{shape.value=0;breast.value=0;height.value=100;mass.value=100;body.rotation.y=0;apply()};try{const raw=await fetch('./makehuman-v5/base.obj').then(r=>r.text());const lines=raw.split(/\r?\n/);let vi=0;const kept=[];for(const line of lines){if(line.startsWith('v ')){if(vi<13380)kept.push(line);vi++;}else if(line.startsWith('vt ')||line.startsWith('vn ')||line.startsWith('o ')||line.startsWith('g ')||line.startsWith('s ')||line.startsWith('usemtl '))kept.push(line);else if(line.startsWith('f ')){const ids=line.slice(2).trim().split(/\s+/).map(x=>parseInt(x.split('/')[0],10));if(ids.every(i=>i>0&&i<=13380))kept.push(line)}}const obj=new OBJLoader().parse(kept.join('\n'));body=obj.children.find(x=>x.isMesh);body.material=new THREE.MeshStandardMaterial({color:0xd6a58f,roughness:.82,side:THREE.DoubleSide});body.geometry=body.geometry.toNonIndexed();basePos=new Float32Array(body.geometry.attributes.position.array);/* OBJLoader expands indexed vertices, while MakeHuman targets index source vertices. Build source-index mapping from positions. */const src=[];for(const l of lines){if(l.startsWith('v ')&&src.length<13380){const a=l.trim().split(/\s+/);src.push([+a[1],+a[2],+a[3]])}}const key=(x,y,z)=>x.toFixed(6)+','+y.toFixed(6)+','+z.toFixed(6),lookup=new Map(src.map((v,i)=>[key(...v),i]));const expanded=body.geometry.attributes.position.array,expToSrc=[];for(let j=0;j<expanded.length;j+=3)expToSrc.push(lookup.get(key(expanded[j],expanded[j+1],expanded[j+2]))??-1);async function expandTarget(url){const m=await target(url),out=new Map();expToSrc.forEach((si,ei)=>{const d=m.get(si);if(d)out.set(ei,d)});return out}targetShape=await expandTarget('./makehuman-v5/targets/bodyshapes/bodyshapes-elvs-fem-neat-hourglass.target');targetBreastUp=await expandTarget('./makehuman-v5/targets/breast/breast-volume-vert-up.target');targetBreastDown=await expandTarget('./makehuman-v5/targets/breast/breast-volume-vert-down.target');scene.add(body);const box=new THREE.Box3().setFromObject(body),c=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());body.position.sub(c);body.position.y+=size.y*.02;camera.position.z=Math.max(4.5,size.y*1.65);status.textContent='Готово. Настоящие MakeHuman morph targets подключены — крути «Тип фигуры» и «Грудь».';apply()}catch(e){console.error(e);status.textContent='Ошибка v6: '+e.message}function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();</script></body></html>
