<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A170 v3.2</title><style>body{margin:0;background:#0d1015;color:#eee;font:14px ui-monospace,monospace}header,.ui{padding:12px}main{display:grid;grid-template-columns:1fr 300px}.stage{min-height:70vh;display:grid;place-items:center;background:#151922}canvas{height:min(80vh,720px);max-width:95vw;image-rendering:pixelated;border:1px solid #39414d}.c{margin:0 0 18px}.c label{display:flex;justify-content:space-between}.c input{width:100%;margin-top:8px}.note{opacity:.65;font-size:11px;line-height:1.5}@media(max-width:700px){main{display:block}.stage{min-height:55vh}canvas{height:52vh}.ui{border-top:1px solid #333}}</style></head><body><header><b>A170 Full Body PoC v3.2</b><div>regional masks: руки и голова не деформируются ползунками тела</div></header><main><section class="stage"><canvas id="c" width="256" height="448"></canvas></section><section class="ui"><div class="c"><label>Талия <b id="wv">0.00</b></label><input id="w" type="range" min="-1" max="1" step=".01" value="0"></div><div class="c"><label>Бёдра <b id="hv">0.00</b></label><input id="h" type="range" min="-1" max="1" step=".01" value="0"></div><div class="c"><label>Длина ног <b id="lv">0.00</b></label><input id="l" type="range" min="-1" max="1" step=".01" value="0"></div><div class="c"><label>Показать зоны <input id="zones" type="checkbox"></label></div><div class="c"><label>Исходник <input id="orig" type="checkbox"></label></div><div class="note">v3.2: исходник всегда рисуется целиком. Поверх него деформируются только центральный torso/pelvis и отдельные ноги. Руки и голова остаются 1:1. Это ещё CPU prototype, не финальный mesh.</div></section></main><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const $=id=>document.getElementById(id),U={w:$('w'),h:$('h'),l:$('l'),zones:$('zones'),orig:$('orig')};const src=document.createElement('canvas');src.width=256;src.height=448;const sg=src.getContext('2d');sg.imageSmoothingEnabled=false;const img=new Image();const smooth=(a,b,x)=>{let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};function extractData(html){const m=html.match(/const DATA='([^']+)'/);if(!m)throw new Error('A170 DATA not found');return m[1]}function bodyHalfWidth(y,W,H){let base=0,wa=0,hi=0;if(y<82||y>218)return 0;if(y<128){base=48;wa=smooth(82,128,y)}else if(y<160){base=48-(y-128)*.45;wa=1}else if(y<190){base=34+(y-160)*.28;wa=1-smooth(160,190,y);hi=smooth(160,190,y)}else{base=43;hi=1-smooth(190,218,y)}return Math.max(18,base+W*12*wa+H*15*hi)}function srcHalfWidth(y){return bodyHalfWidth(y,0,0)}function drawWarpedTorso(W,H){g.save();g.beginPath();for(let y=82;y<=218;y++){const hw=bodyHalfWidth(y,W,H);if(y===82)g.moveTo(128-hw,y);else g.lineTo(128-hw,y)}for(let y=218;y>=82;y--){const hw=bodyHalfWidth(y,W,H);g.lineTo(128+hw,y)}g.closePath();g.clip();for(let y=82;y<=218;y++){const sw=srcHalfWidth(y),dw=bodyHalfWidth(y,W,H);g.drawImage(src,128-sw,y,sw*2,1,128-dw,y,dw*2,1)}g.restore()}function legShift(y,L){if(y<210)return 0;return L*32*smooth(210,410,y)}function drawLeg(x0,x1,L){g.save();g.beginPath();g.rect(x0,205,x1-x0,220);g.clip();for(let y=205;y<425;y++){const dy=legShift(y,L);const sy=Math.max(205,Math.min(424,y-dy));g.drawImage(src,x0,Math.round(sy),x1-x0,1,x0,y,x1-x0,1)}g.restore()}function drawZones(){g.save();g.strokeStyle='#56d4d4';g.fillStyle='#56d4d422';g.lineWidth=1;g.fillRect(78,82,100,136);g.strokeRect(78,82,100,136);g.fillRect(82,205,45,220);g.strokeRect(82,205,45,220);g.fillRect(129,205,45,220);g.strokeRect(129,205,45,220);g.restore()}function render(){const W=+U.w.value,H=+U.h.value,L=+U.l.value;$('wv').textContent=W.toFixed(2);$('hv').textContent=H.toFixed(2);$('lv').textContent=L.toFixed(2);g.clearRect(0,0,256,448);g.fillStyle='#151922';g.fillRect(0,0,256,448);g.drawImage(src,0,0);if(!U.orig.checked){drawWarpedTorso(W,H);drawLeg(82,127,L);drawLeg(129,174,L)}if(U.zones.checked)drawZones()}fetch('./character-fullbody-v3.html',{cache:'no-store'}).then(r=>r.text()).then(t=>{img.onload=()=>{sg.clearRect(0,0,256,448);sg.drawImage(img,0,0,256,448);render()};img.src=extractData(t)}).catch(e=>{g.fillStyle='#f88';g.fillText('Ошибка загрузки A170: '+e.message,10,20)});Object.values(U).forEach(el=>el.addEventListener('input',render))})();</script></body></html>
