<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A170 v3.1</title><style>body{margin:0;background:#0d1015;color:#eee;font:14px ui-monospace,monospace}header,.ui{padding:12px}header div{opacity:.7;margin-top:4px}main{display:grid;grid-template-columns:1fr 310px}.stage{min-height:70vh;display:grid;place-items:center;background:#151922}canvas{height:min(80vh,720px);max-width:95vw;image-rendering:pixelated;border:1px solid #39414d}.c{margin:0 0 18px}.c label{display:flex;justify-content:space-between}.c input[type=range]{width:100%;margin-top:8px}.note{opacity:.65;font-size:11px;line-height:1.5}.row{display:flex;gap:10px;align-items:center;margin:12px 0}@media(max-width:700px){main{display:block}.stage{min-height:55vh}canvas{height:52vh}.ui{border-top:1px solid #333}}</style></head><body><header><b>A170 Full Body PoC v3.1</b><div>smooth cage-like warp: деформируем исходный A170 без полос</div></header><main><section class="stage"><canvas id="c" width="256" height="448"></canvas></section><section class="ui"><div class="c"><label>Талия <b id="wv">0.00</b></label><input id="w" type="range" min="-1" max="1" step=".01" value="0"></div><div class="c"><label>Бёдра <b id="hv">0.00</b></label><input id="h" type="range" min="-1" max="1" step=".01" value="0"></div><div class="c"><label>Длина ног <b id="lv">0.00</b></label><input id="l" type="range" min="-1" max="1" step=".01" value="0"></div><div class="row"><label><input id="grid" type="checkbox"> показать cage</label><label><input id="compare" type="checkbox"> исходник</label></div><div class="note">Нейтраль 0/0/0 должна совпадать с v3. Здесь нет отдельных горизонтальных полос: каждая строка получает плавное смещение из нескольких control-зон. Это промежуточный CPU-прототип FFD/cage перед настоящим GPU mesh.</div></section></main><script>(()=>{const C=document.getElementById('c'),g=C.getContext('2d',{alpha:true});g.imageSmoothingEnabled=false;const W=256,H=448,$=id=>document.getElementById(id),ui={w:$('w'),h:$('h'),l:$('l'),grid:$('grid'),compare:$('compare')},out={w:$('wv'),h:$('hv'),l:$('lv')};const src=document.createElement('canvas');src.width=W;src.height=H;const sg=src.getContext('2d');sg.imageSmoothingEnabled=false;let base=null;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const smooth=(y,c,r)=>{let t=1-Math.abs(y-c)/r;if(t<=0)return 0;t=clamp(t,0,1);return t*t*(3-2*t)};function yMap(y,L){if(!L)return y;const hip=190,knee=302,ank=382,foot=421;const amount=L*30;if(y<hip)return y;const t=clamp((y-hip)/(foot-hip),0,1);const eased=t*t*(3-2*t);return y+amount*eased}function xScale(y,waist,hips){const waistInf=smooth(y,158,68);const hipInf=smooth(y,196,72);const thighFade=smooth(y,250,105);return 1+waist*.22*waistInf+hips*.20*(.75*hipInf+.25*thighFade)}function render(){if(!base)return;const waist=+ui.w.value,hips=+ui.h.value,L=+ui.l.value;out.w.textContent=waist.toFixed(2);out.h.textContent=hips.toFixed(2);out.l.textContent=L.toFixed(2);if(ui.compare.checked){g.clearRect(0,0,W,H);g.drawImage(src,0,0);return}const S=base.data,D=g.createImageData(W,H),d=D.data;for(let y=0;y<H;y++){const syf=yMap(y,-L),sy=clamp(Math.round(syf),0,H-1);const sc=xScale(sy,waist,hips);for(let x=0;x<W;x++){const sx=clamp(Math.round(128+(x-128)/sc),0,W-1);const si=(sy*W+sx)*4,di=(y*W+x)*4;d[di]=S[si];d[di+1]=S[si+1];d[di+2]=S[si+2];d[di+3]=S[si+3]}}g.putImageData(D,0,0);if(ui.grid.checked)drawCage(waist,hips,L)}function drawCage(waist,hips,L){g.save();g.strokeStyle='rgba(67,220,226,.78)';g.fillStyle='rgba(255,225,77,.95)';g.lineWidth=1;const ys=[86,126,158,190,211,250,302,382,421];for(const y0 of ys){const y=yMap(y0,L),sc=xScale(y0,waist,hips),half=(y0<100?47:y0<135?39:y0<175?30:y0<220?39:y0<310?31:y0<385?22:18)*sc;g.beginPath();g.moveTo(128-half,y);g.lineTo(128+half,y);g.stroke();g.fillRect(Math.round(128-half)-1,Math.round(y)-1,3,3);g.fillRect(Math.round(128+half)-1,Math.round(y)-1,3,3)}g.restore()}async function load(){try{const txt=await fetch('character-fullbody-v3.html?raw=1',{cache:'no-store'}).then(r=>r.text());const m=txt.match(/const DATA='([^']+)'/);if(!m)throw Error('DATA not found');const im=new Image();im.onload=()=>{sg.clearRect(0,0,W,H);sg.drawImage(im,0,0,W,H);base=sg.getImageData(0,0,W,H);render()};im.src=m[1]}catch(e){g.fillStyle='#fff';g.fillText('Ошибка загрузки A170: '+e.message,10,30)}}Object.values(ui).forEach(el=>el.addEventListener('input',render));load()})();</script></body></html>
