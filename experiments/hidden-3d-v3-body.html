<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111117" />
<title>Human Body → Pixel test v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111117;color:#eee;font-family:system-ui,-apple-system,sans-serif}body{padding:8px;display:flex;justify-content:center}.app{width:min(100%,540px)}h1{font-size:18px;margin:0 0 3px}.sub{font-size:11px;line-height:1.3;color:#aaa;margin-bottom:6px}.stage{position:relative;width:100%;height:min(56vh,470px);min-height:330px;background:#24242d;border:1px solid #363640;border-radius:14px;overflow:hidden}.stage canvas{display:block!important;width:100%!important;height:100%!important;image-rendering:pixelated;image-rendering:crisp-edges}.status{position:absolute;left:8px;right:8px;bottom:8px;background:#000c;padding:6px 8px;border-radius:9px;font-size:10px;line-height:1.25;pointer-events:none}.badge{position:absolute;top:8px;left:8px;background:#000a;border-radius:999px;padding:4px 7px;font-size:10px;pointer-events:none}.panel{margin-top:7px;background:#1b1b22;border:1px solid #303039;border-radius:14px;padding:9px}.row{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}.row label{font-size:11px;color:#bbb;flex:1 1 145px}.row input[type=range]{width:100%}button{border:1px solid #41414c;background:#282832;color:#eee;border-radius:9px;padding:8px 8px;font-weight:650;flex:1}button.active{background:#ececf2;color:#111117}.tiny{font-size:10px;color:#90909c;line-height:1.35;margin-top:6px}.warn{color:#d2b179}
@media(max-height:760px){.stage{height:45vh;min-height:280px}.sub{display:none}.status{font-size:9px}.panel{padding:7px}.row{margin:3px 0}button{padding:7px 5px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/","mannequin":"https://cdn.jsdelivr.net/npm/mannequin-js@latest/src/mannequin.js"}}
</script>
</head>
<body><div class="app">
<h1>Human Body → Pixel v3</h1><div class="sub">Нейтральная женская фигура: пропорции, суставы и статические позы.</div>
<div class="stage" id="stage"><div class="badge">BODY / PIXEL TEST</div><div class="status" id="status">Загрузка человеческой фигуры…</div></div>
<div class="panel">
<div class="row"><button id="neutral" class="active">Нейтрально</button><button id="weight">Вес на ногу</button><button id="step">Шаг</button><button id="sit">Сидит</button></div>
<div class="row"><button id="front" class="active">Спереди</button><button id="three">¾</button><button id="side">Сбоку</button></div>
<div class="row"><label>Рост: <b id="heightText">165 см</b><input id="height" type="range" min="150" max="190" value="165" /></label><label>Ширина силуэта*: <b id="widthText">100%</b><input id="width" type="range" min="82" max="125" value="100" /></label></div>
<div class="row"><label>Пиксельный масштаб: <b id="pixelText">100%</b><input id="pixel" type="range" min="55" max="130" value="100" /></label><label>Поворот: <b id="yawText">0°</b><input id="yaw" type="range" min="-80" max="80" value="0" /></label></div>
<div class="tiny"><span class="warn">*</span> Ширина пока грубый технический масштаб, не анатомический morph.</div></div></div>
<script type="module">
import { createStage, Female } from 'mannequin';
const stageHost=document.querySelector('#stage'),status=document.querySelector('#status');
const height=document.querySelector('#height'),width=document.querySelector('#width'),pixel=document.querySelector('#pixel'),yaw=document.querySelector('#yaw');
const heightText=document.querySelector('#heightText'),widthText=document.querySelector('#widthText'),pixelText=document.querySelector('#pixelText'),yawText=document.querySelector('#yawText');
let woman,neutralPosture;
createStage(); woman=new Female(1.65); neutralPosture=JSON.parse(JSON.stringify(woman.posture)); woman.recolor('#d9ad92','#3a3333','#d7a88f','#c08f78','#d9ad92','#d5a68d','#c9957e'); woman.turn=0; woman.stepOnGround();
function adoptCanvas(){const c=[...document.querySelectorAll('canvas')].at(-1);if(c&&c.parentElement!==stageHost)stageHost.prepend(c);status.textContent='Готово. Переключай позы и ракурсы.';}setTimeout(adoptCanvas,80);setTimeout(adoptCanvas,400);
function reset(){woman.posture=JSON.parse(JSON.stringify(neutralPosture));woman.position.x=0;woman.position.z=0;woman.position.y=0;woman.stepOnGround();}
function applyPose(name){reset();if(name==='weight'){woman.body.tilt=-4;woman.body.bend=2;woman.l_leg.raise=-4;woman.l_leg.straddle=4;woman.l_knee.bend=4;woman.r_leg.raise=5;woman.r_leg.straddle=-3;woman.r_knee.bend=10;woman.r_ankle.bend=5;woman.torso.tilt=3;woman.l_arm.straddle=4;woman.r_arm.straddle=-3;}if(name==='step'){woman.body.bend=3;woman.body.tilt=-2;woman.l_leg.raise=25;woman.l_knee.bend=24;woman.l_ankle.bend=-8;woman.r_leg.raise=-15;woman.r_knee.bend=12;woman.r_ankle.bend=10;woman.l_arm.raise=-18;woman.r_arm.raise=18;woman.l_elbow.bend=18;woman.r_elbow.bend=12;}if(name==='sit'){woman.body.bend=7;woman.l_leg.raise=76;woman.r_leg.raise=76;woman.l_knee.bend=88;woman.r_knee.bend=88;woman.l_ankle.bend=7;woman.r_ankle.bend=7;woman.l_arm.raise=28;woman.r_arm.raise=28;woman.l_elbow.bend=58;woman.r_elbow.bend=58;woman.position.y=-.45;}woman.turn=Number(yaw.value);woman.stepOnGround();document.querySelectorAll('#neutral,#weight,#step,#sit').forEach(b=>b.classList.toggle('active',b.id===name));}
['neutral','weight','step','sit'].forEach(id=>document.querySelector('#'+id).onclick=()=>applyPose(id));
function setYaw(v){yaw.value=v;yawText.textContent=v+'°';woman.turn=Number(v);document.querySelectorAll('#front,#three,#side').forEach(b=>b.classList.remove('active'));}
document.querySelector('#front').onclick=()=>{setYaw(0);document.querySelector('#front').classList.add('active')};document.querySelector('#three').onclick=()=>{setYaw(-35);document.querySelector('#three').classList.add('active')};document.querySelector('#side').onclick=()=>{setYaw(-75);document.querySelector('#side').classList.add('active')};yaw.oninput=()=>setYaw(yaw.value);
height.oninput=()=>{heightText.textContent=height.value+' см';woman.scale.y=Number(height.value)/165;woman.stepOnGround();};width.oninput=()=>{widthText.textContent=width.value+'%';const s=Number(width.value)/100;woman.scale.x=s;woman.scale.z=s;woman.stepOnGround();};pixel.oninput=()=>{pixelText.textContent=pixel.value+'%';const c=stageHost.querySelector('canvas');if(c){const factor=Number(pixel.value)/100;c.style.width=(100/factor)+'%';c.style.height=(100/factor)+'%';c.style.transform=`scale(${factor})`;c.style.transformOrigin='50% 50%';}};applyPose('neutral');
</script></body></html>
