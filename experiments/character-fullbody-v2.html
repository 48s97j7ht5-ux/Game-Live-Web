<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Full Body PoC v2</title><style>:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:#0d0f13;color:#eef1f5}header{padding:10px 14px;border-bottom:1px solid #2a3039}header b{font-size:14px}header small{display:block;opacity:.55;margin-top:3px}main{display:grid;grid-template-columns:1fr 300px;min-height:calc(100svh - 58px)}.stage{display:grid;place-items:center;min-height:60svh;background:radial-gradient(circle,#1c222c,#0b0d11 70%)}canvas{height:min(78svh,720px);width:auto;max-width:92vw;image-rendering:pixelated;border:1px solid #303846;background:#151922}.ui{padding:14px;background:#11151b;border-left:1px solid #2b313a}.c{margin:0 0 15px}.c label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.c input{width:100%}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:15px}button{font:inherit;font-size:11px;padding:9px 4px;color:#e8ebef;background:#1b2028;border:1px solid #3b4350;border-radius:7px}button.on{background:#e8ebef;color:#111}.note{font-size:10px;line-height:1.5;opacity:.6;border-top:1px solid #2a3039;padding-top:10px}@media(max-width:760px){main{grid-template-columns:1fr;display:block}.stage{min-height:55svh;padding:8px}.ui{border-left:0;border-top:1px solid #2b313a}canvas{height:min(52svh,600px)}}</style></head><body><header><b>Full Body Character PoC v2</b><small>целая модель: body regions → pose → view → garment → pixel render</small></header><main><section class="stage"><canvas id="c" width="256" height="448"></canvas></section><aside class="ui"><div class="c"><label><span>Рост / ноги</span><b id="hv">0.00</b></label><input id="h" type="range" min="-1" max="1" step=".01" value="0"></div><div class="c"><label><span>Талия / живот</span><b id="wv">0.00</b></label><input id="w" type="range" min="-1" max="1" step=".01" value="0"></div><div class="c"><label><span>Бёдра</span><b id="pv">0.00</b></label><input id="p" type="range" min="-1" max="1" step=".01" value="0"></div><div class="c"><label><span>Поза</span><b id="posev">0°</b></label><input id="pose" type="range" min="-22" max="22" step="1" value="0"></div><div class="c"><label><span>Ракурс</span><b id="vv">FRONT</b></label><input id="v" type="range" min="0" max="90" step="1" value="0"></div><div class="views"><button data-v="0" class="on">FRONT</button><button data-v="45">3/4</button><button data-v="90">SIDE</button></div><div class="c"><label><span>Простая одежда</span><b>ON</b></label><input id="cloth" type="checkbox" checked></div><div class="c"><label><span>Показать rig</span><b>DEBUG</b></label><input id="rig" type="checkbox"></div><div class="note">Это уже full-body тест. Суставы намеренно не шлифуем отдельно: проверяем силуэт, связанные пропорции, позу, псевдо-глубину и одежду на целой фигуре. Геометрия построена по пропорциям A170: 170 см = 400 px.</div></aside></main><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const $=x=>document.getElementById(x),U={h:$('h'),w:$('w'),p:$('p'),pose:$('pose'),v:$('v'),cloth:$('cloth'),rig:$('rig')};const lerp=(a,b,t)=>a+(b-a)*t,rad=d=>d*Math.PI/180;function poly(points,fill,stroke='#3b2020'){g.beginPath();points.forEach((q,i)=>(i?g.lineTo:g.moveTo).call(g,Math.round(q[0]),Math.round(q[1])));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}function limb(a,b,ra,rb,fill){const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;poly([[a.x+nx*ra,a.y+ny*ra],[b.x+nx*rb,b.y+ny*rb],[b.x-nx*rb,b.y-ny*rb],[a.x-nx*ra,a.y-ny*ra]],fill)}function dot(q,col='#ffe45d'){g.fillStyle=col;g.fillRect(Math.round(q.x)-2,Math.round(q.y)-2,5,5)}function draw(){const H=+U.h.value,W=+U.w.value,P=+U.p.value,pose=+U.pose.value,V=+U.v.value,t=V/90,skin='#e5a88f',deep='#c47e70',outline='#3b2020';$('hv').textContent=H.toFixed(2);$('wv').textContent=W.toFixed(2);$('pv').textContent=P.toFixed(2);$('posev').textContent=pose+'°';$('vv').textContent=V<23?'FRONT':V<68?'3/4':'SIDE';document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',+b.dataset.v===V));g.clearRect(0,0,256,448);g.fillStyle='#151922';g.fillRect(0,0,256,448);const cx=128,depth=lerp(1,.48,t),legK=1+H*.10,head={x:cx+lerp(0,7,t),y:43},neckY=72,shouldY=87,underY=126,waistY=158-H*2,hipY=190-H*2,crotchY=211-H*2,kneeY=302+(legK-1)*45,ankleY=382+(legK-1)*65,ground=421,shouldW=46*depth,chestW=(35+W*2)*depth,waistW=(27+W*8)*depth,hipW=(38+P*11)*depth;const sway=Math.sin(rad(pose))*8,bodyCx=cx+sway*.3;const farShould={x:bodyCx-shouldW,y:shouldY},nearShould={x:bodyCx+shouldW,y:shouldY},farElbow={x:bodyCx-(shouldW+15*depth),y:151},nearElbow={x:bodyCx+(shouldW+15*depth),y:151},farHand={x:bodyCx-(hipW+15*depth),y:213},nearHand={x:bodyCx+(hipW+15*depth),y:213};const farHip={x:bodyCx-hipW*.48,y:crotchY},nearHip={x:bodyCx+hipW*.48,y:crotchY},farKnee={x:farHip.x-sway*.15,y:kneeY},nearKnee={x:nearHip.x+sway*.18,y:kneeY},farAnkle={x:farKnee.x+sway*.1,y:ankleY},nearAnkle={x:nearKnee.x-sway*.12,y:ankleY};limb(farShould,farElbow,8*depth+2,7*depth+2,deep);limb(farElbow,farHand,7*depth+2,5*depth+2,deep);limb(farHip,farKnee,16*depth+4,11*depth+3,deep);limb(farKnee,farAnkle,11*depth+3,7*depth+3,deep);poly([[bodyCx-shouldW,shouldY],[bodyCx-chestW,underY],[bodyCx-waistW,waistY],[bodyCx-hipW,hipY],[bodyCx-hipW*.72,crotchY],[bodyCx+hipW*.72,crotchY],[bodyCx+hipW,hipY],[bodyCx+waistW,waistY],[bodyCx+chestW,underY],[bodyCx+shouldW,shouldY]],skin);g.fillStyle=skin;g.strokeStyle=outline;g.lineWidth=2;g.beginPath();g.ellipse(Math.round(head.x),head.y,Math.max(13,Math.round(26*depth)),31,0,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.moveTo(bodyCx-10*depth,70);g.lineTo(bodyCx-13*depth,82);g.lineTo(bodyCx+13*depth,82);g.lineTo(bodyCx+10*depth,70);g.closePath();g.fill();g.stroke();if(t>.12){poly([[head.x+17*depth,40],[head.x+25*depth+7*t,45],[head.x+17*depth,49]],skin)}limb(nearHip,nearKnee,16*depth+4,11*depth+3,skin);limb(nearKnee,nearAnkle,11*depth+3,7*depth+3,skin);poly([[farAnkle.x-8,ankleY-2],[farAnkle.x+7,ankleY-2],[farAnkle.x+11,ground-4],[farAnkle.x-12,ground-4]],deep);poly([[nearAnkle.x-8,ankleY-2],[nearAnkle.x+7,ankleY-2],[nearAnkle.x+15+8*t,ground-4],[nearAnkle.x-12,ground-4]],skin);limb(nearShould,nearElbow,8*depth+2,7*depth+2,skin);limb(nearElbow,nearHand,7*depth+2,5*depth+2,skin);if(U.cloth.checked){const top=hipY-13,bottom=crotchY+17;poly([[bodyCx-(waistW+3),top],[bodyCx+(waistW+3),top],[bodyCx+(hipW+4),bottom],[bodyCx+3,bottom-2],[bodyCx,bottom-11],[bodyCx-3,bottom-2],[bodyCx-(hipW+4),bottom]],'#303746','#171b24');g.strokeStyle='#69758d';g.beginPath();g.moveTo(bodyCx-waistW,top+4);g.lineTo(bodyCx+waistW,top+4);g.stroke()}g.fillStyle='#332a2a';g.fillRect(Math.round(head.x-18*depth),18,Math.round(36*depth),6);if(U.rig.checked){[head,farShould,nearShould,farElbow,nearElbow,farHand,nearHand,farHip,nearHip,farKnee,nearKnee,farAnkle,nearAnkle].forEach(q=>dot(q));g.strokeStyle='#58d6d6';g.lineWidth=1;[[farShould,farElbow],[farElbow,farHand],[nearShould,nearElbow],[nearElbow,nearHand],[farHip,farKnee],[farKnee,farAnkle],[nearHip,nearKnee],[nearKnee,nearAnkle]].forEach(([a,b])=>{g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()})}}Object.values(U).forEach(x=>x.addEventListener('input',draw));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{U.v.value=b.dataset.v;draw()});draw()})();</script></body></html>
