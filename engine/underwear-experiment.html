<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game Live · Underwear test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;--bg:#090c12;--panel:#111722;--line:#334158;--text:#eef4ff;--muted:#9aa9bf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:350px 1fr;height:100vh}.side{padding:16px;background:#111722;border-right:1px solid var(--line);overflow:auto;z-index:10}.title{font-weight:900;font-size:17px}.small{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px}.slot{margin-top:14px}.slotlabel{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#9fb0c8;font-weight:900;margin-bottom:6px}.pick{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}.pick button{font-size:20px}.name,.diag{border:1px solid var(--line);border-radius:10px;background:#171f2d;padding:10px;text-align:center;font-size:12px;font-weight:800}.diag{margin-top:10px;text-align:left;font-weight:650;line-height:1.35;word-break:break-word}.diag.ok{border-color:#315f48}.diag.err{border-color:#8a3940;color:#ffd5d8}.tools,.views{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.views{grid-template-columns:repeat(4,1fr)}button{border:1px solid #3a465b;border-radius:9px;background:#20293a;color:#edf3ff;padding:9px 7px;font-size:11px;font-weight:800}.active{background:#355276}.stage{position:relative;min-width:0}.stage canvas{display:block;width:100%;height:100%}.badge{position:absolute;left:14px;top:14px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#111722dd;font-size:10px;color:#aebbd0}
@media(max-width:680px){.app{display:block}.side{position:absolute;left:6px;top:6px;width:min(350px,calc(100vw - 12px));max-height:44vh;padding:11px;border:1px solid var(--line);border-radius:13px;background:#111722ef}.title{font-size:14px}.small{display:none}.slot{margin-top:8px}.diag{font-size:11px;padding:8px}.tools,.views{margin-top:8px}.stage{height:100vh}.badge{display:none}}
</style></head><body><div class="app"><aside class="side">
<div class="title">Underwear · MakeHuman</div><div class="small">Независимые слоты верх/низ. MHCLO fitting + delete_verts на hm08. Рост персонажа на экране: 400 px.</div>
<div class="slot"><div class="slotlabel">Лифчик</div><div class="pick"><button id="topPrev">◀</button><div class="name" id="topName">Без лифчика</div><button id="topNext">▶</button></div></div>
<div class="slot"><div class="slotlabel">Трусы</div><div class="pick"><button id="bottomPrev">◀</button><div class="name" id="bottomName">Без трусов</div><button id="bottomNext">▶</button></div></div>
<div class="diag" id="diag">Старт…</div><div class="tools"><button id="free" class="active">Крутить</button><button id="wire">Сетка одежды</button></div><div class="views"><button data-v="0">Перед</button><button data-v="2">Право</button><button data-v="4">Зад</button><button data-v="6">Лево</button></div>
</aside><main class="stage" id="stage"><div class="badge">hm08 · MHCLO underwear · 400 px</div></main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
import * as RT from './mpfb-runtime.js?v=20260815-5';
const BASE='./anny/mpfb2/3dobjs/base.obj',ROOT='./clothes/underwear',TARGET_PX=400;
const TOPS=[{name:'Без лифчика'},{name:'Plain Bra',id:'joepal_plain_bra'},{name:'Bandeau Bra',id:'punkduck_bandeau_bra'},{name:'Bikini 02 Bra',id:'punkduck_bikini02_bra'}];
const BOTTOMS=[{name:'Без трусов'},{name:'Bow Panty',id:'elvs_bow_bottom_panty'},{name:'Lace Panty',id:'elvs_lace_panty'},{name:'Bandeau Bikini Slip',id:'punkduck_bandeau_bikini_slip'},{name:'Bikini 02 Slip',id:'punkduck_bikini02_slip'}];
const $=x=>document.getElementById(x),stage=$('stage'),diag=$('diag');let ti=0,bi=0,body=null,baseMesh=null,topMesh=null,bottomMesh=null,topMeta=null,bottomMeta=null,wire=false,bodyHeight=1,bodyCenterY=.5,radius=5;const cache=new Map();
function msg(s,type=''){diag.className='diag '+type;diag.textContent=s}
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x090c12);const cam=new THREE.PerspectiveCamera(30,1,.01,100),ctl=new OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x222233,2.2));const dl=new THREE.DirectionalLight(0xffddcc,2.5);dl.position.set(-4,7,5);scene.add(dl);const skin=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,side:THREE.DoubleSide});
function obj(t){const v=[],uv=[],f=[];for(const l of t.split(/\r?\n/)){const s=l.trim(),p=s.split(/\s+/);if(s.startsWith('v '))v.push([+p[1],+p[2],+p[3]]);else if(s.startsWith('vt '))uv.push([+p[1],+p[2]]);else if(s.startsWith('f ')){const q=p.slice(1).map(x=>{const a=x.split('/');return[+a[0]-1,a[1]?+a[1]-1:-1]});for(let i=1;i<q.length-1;i++)f.push([q[0],q[i],q[i+1]])}}return{v,uv,f}}
async function txt(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${url}`);return r.text()}
async function asset(kind,id){const key=kind+'/'+id;if(cache.has(key))return cache.get(key);const p=(async()=>{const root=`${ROOT}/${kind}/${id}`;const meta=RT.parseMHCLO(await txt(`${root}/${id}.mhclo`));let objText=null,err=[];for(const name of RT.clothObjCandidates(meta,id)){try{objText=await txt(`${root}/${name}`);break}catch(e){err.push(name)}}if(!objText)throw Error('OBJ not found: '+err.join(', '));return{m:meta,o:obj(objText)}})();cache.set(key,p);return p}
function makeMesh(a,color){if(!a.m.verts.length)throw Error('MHCLO: 0 mappings');if(!a.o.f.length)throw Error('OBJ: 0 faces');const fv=RT.fitMHCLO(a.m,baseMesh.vertices),pos=[],uv=[];for(const tri of a.o.f)for(const c of tri){const k=c[0]*3;if(k+2>=fv.length)continue;pos.push(fv[k],fv[k+1],fv[k+2]);uv.push(...(a.o.uv[c[1]]||[0,0]))}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({color,roughness:.7,side:THREE.DoubleSide,wireframe:wire});const m=new THREE.Mesh(g,mat);m.position.copy(body.position);scene.add(m);return m}
function dispose(m){if(!m)return;scene.remove(m);m.geometry.dispose();m.material.dispose()}
function refreshBodyFaces(){body.geometry.setIndex(RT.filterFaces(baseMesh.bodyFaces,RT.mergeDeleteVerts(topMeta?.deleteVerts,bottomMeta?.deleteVerts)));body.geometry.computeVertexNormals()}
async function rebuildSlot(kind){try{const list=kind==='top'?TOPS:BOTTOMS,idx=kind==='top'?ti:bi,item=list[idx];if(kind==='top'){dispose(topMesh);topMesh=null;topMeta=null;$('topName').textContent=item.name}else{dispose(bottomMesh);bottomMesh=null;bottomMeta=null;$('bottomName').textContent=item.name}if(!item.id){refreshBodyFaces();msg('Готово · слоты переключаются независимо','ok');return}msg('Загрузка '+item.name+'…');const a=await asset(kind,item.id),mesh=makeMesh(a,kind==='top'?0xc97b9f:0x7396c8);if(kind==='top'){topMesh=mesh;topMeta=a.m}else{bottomMesh=mesh;bottomMeta=a.m}refreshBodyFaces();msg(`OK · верх: ${TOPS[ti].name} · низ: ${BOTTOMS[bi].name}`,'ok')}catch(e){console.error(e);msg('ОШИБКА · '+e.message,'err')}}
function fitCamera(){const h=Math.max(stage.clientHeight,1),fov=THREE.MathUtils.degToRad(cam.fov),d=bodyHeight*h/(2*TARGET_PX*Math.tan(fov/2));radius=Math.max(d,bodyHeight*.8);cam.position.set(0,bodyCenterY,radius);ctl.target.set(0,bodyCenterY,0);ctl.minDistance=radius*.45;ctl.maxDistance=radius*5;ctl.update()}
function ground(){body.position.set(0,0,0);const b=new THREE.Box3().setFromObject(body),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());body.position.set(-c.x,-b.min.y,-c.z);for(const m of[topMesh,bottomMesh])if(m)m.position.copy(body.position);bodyHeight=s.y;bodyCenterY=s.y*.5;fitCamera()}
function view(i){ctl.enableRotate=false;$('free').classList.remove('active');const a=i*Math.PI/4;cam.position.set(Math.sin(a)*radius,bodyCenterY,Math.cos(a)*radius);ctl.target.set(0,bodyCenterY,0);ctl.update()}function free(){ctl.enableRotate=true;$('free').classList.add('active')}
async function load(){msg('Загрузка тела…');const r=await fetch(BASE);if(!r.ok)throw Error('base '+r.status);baseMesh=RT.parseBaseOBJ(await r.text());const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(baseMesh.vertices),3));g.setIndex(baseMesh.bodyFaces);g.computeVertexNormals();body=new THREE.Mesh(g,skin);scene.add(body);ground();free();await rebuildSlot('top');await rebuildSlot('bottom')}
$('topPrev').onclick=()=>{ti=(ti-1+TOPS.length)%TOPS.length;rebuildSlot('top')};$('topNext').onclick=()=>{ti=(ti+1)%TOPS.length;rebuildSlot('top')};$('bottomPrev').onclick=()=>{bi=(bi-1+BOTTOMS.length)%BOTTOMS.length;rebuildSlot('bottom')};$('bottomNext').onclick=()=>{bi=(bi+1)%BOTTOMS.length;rebuildSlot('bottom')};$('free').onclick=free;$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);for(const m of[topMesh,bottomMesh])if(m)m.material.wireframe=wire};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(+b.dataset.v));function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();if(body)fitCamera()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{ctl.update();renderer.render(scene,cam)});load().catch(e=>msg('ОШИБКА · '+e.message,'err'));
</script></body></html>
