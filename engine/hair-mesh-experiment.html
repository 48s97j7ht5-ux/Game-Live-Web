<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game Live · Hair test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;--bg:#090c12;--panel:#111722;--line:#334158;--text:#eef4ff;--muted:#9aa9bf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:340px 1fr;height:100vh}.side{padding:16px;background:#111722;border-right:1px solid var(--line);overflow:auto;z-index:10}.title{font-weight:900;font-size:17px}.small{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px}.pick{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;margin-top:14px}.pick button{font-size:20px}.name,.diag{border:1px solid var(--line);border-radius:10px;background:#171f2d;padding:10px;text-align:center;font-size:12px;font-weight:800}.diag{margin-top:8px;text-align:left;font-weight:650;line-height:1.35;word-break:break-word}.diag.ok{border-color:#315f48}.diag.err{border-color:#8a3940;color:#ffd5d8}.counter{text-align:center;color:var(--muted);font-size:10px;margin-top:5px}.tools,.views{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.views{grid-template-columns:repeat(4,1fr)}button{border:1px solid #3a465b;border-radius:9px;background:#20293a;color:#edf3ff;padding:9px 7px;font-size:11px;font-weight:800}.active{background:#355276}.stage{position:relative;min-width:0}.stage canvas{display:block;width:100%;height:100%}.badge{position:absolute;left:14px;top:14px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#111722dd;font-size:10px;color:#aebbd0}
@media(max-width:680px){.app{display:block}.side{position:absolute;left:6px;top:6px;width:min(350px,calc(100vw - 12px));max-height:43vh;padding:11px;border:1px solid var(--line);border-radius:13px;background:#111722ef}.title{font-size:14px}.small{display:none}.pick{margin-top:8px}.diag{position:sticky;top:0;font-size:11px;padding:8px;z-index:2}.tools,.views{margin-top:8px}.stage{height:100vh}.badge{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="title">Hair Mesh · MakeHuman</div><div class="small">Проверка настоящих системных MHCLO + OBJ причесок.</div><div class="pick"><button id="prev">◀</button><div class="name" id="name">Bob 01</div><button id="next">▶</button></div><div class="counter" id="count">1 / 5</div><div class="diag" id="diag">Старт…</div><div class="tools"><button id="free" class="active">Крутить</button><button id="wire">Сетка волос</button></div><div class="views"><button data-v="0">Перед</button><button data-v="2">Право</button><button data-v="4">Зад</button><button data-v="6">Лево</button></div></aside><main class="stage" id="stage"><div class="badge">hm08 · MHCLO fitting · runtime · no Y hack</div></main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
import * as RT from './mpfb-runtime.js?v=20260815-5';
const BASE='./anny/mpfb2/3dobjs/base.obj';
const ROOT='./hair';
const H=[{name:'Без волос'},{name:'Bob 01',id:'bob01'},{name:'Long 01',id:'long01'},{name:'Ponytail 01',id:'ponytail01'},{name:'Short 02',id:'short02'},{name:'Braid 01',id:'braid01'}];
const $=x=>document.getElementById(x),stage=$('stage'),diag=$('diag');let hi=1,body=null,baseMesh=null,hair=null,hairMeta=null,hwire=false,radius=5,cy=1;const cache=new Map();
function msg(s,type=''){diag.className='diag '+type;diag.textContent=s}
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x090c12);const cam=new THREE.PerspectiveCamera(30,1,.01,100),ctl=new OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x222233,2.2));const dl=new THREE.DirectionalLight(0xffddcc,2.5);dl.position.set(-4,7,5);scene.add(dl);const skin=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,side:THREE.DoubleSide});
function obj(t){const v=[],uv=[],f=[];for(const l of t.split(/\r?\n/)){const s=l.trim(),p=s.split(/\s+/);if(s.startsWith('v '))v.push([+p[1],+p[2],+p[3]]);else if(s.startsWith('vt '))uv.push([+p[1],+p[2]]);else if(s.startsWith('f ')){const q=p.slice(1).map(x=>{const a=x.split('/');return[+a[0]-1,a[1]?+a[1]-1:-1]});for(let i=1;i<q.length-1;i++)f.push([q[0],q[i],q[i+1]])}}return{v,uv,f}}
function placeHair(){if(!hair||!body)return;hair.position.copy(body.position)}
async function txt(url){msg('GET '+url.split('/').slice(-2).join('/'));let r;try{r=await fetch(url,{cache:'no-store'})}catch(e){throw Error('FETCH/CORS · '+url)}if(!r.ok)throw Error('HTTP '+r.status+' · '+url);return r.text()}
async function asset(id){if(cache.has(id))return cache.get(id);const p=(async()=>{const root=`${ROOT}/${id}`;const meta=RT.parseMHCLO(await txt(`${root}/${id}.mhclo`));let objText=null,err=[];for(const name of RT.clothObjCandidates(meta,id)){try{objText=await txt(`${root}/${name}`);break}catch(e){err.push(name)}}if(!objText)throw Error('OBJ not found: '+err.join(', '));return{m:meta,o:obj(objText),root}})();cache.set(id,p);return p}
function clearHair(){if(!hair)return;scene.remove(hair);hair.geometry.dispose();hair.material.dispose();hair=null;hairMeta=null}
function refreshBodyFaces(){if(!body||!baseMesh)return;body.geometry.setIndex(RT.filterFaces(baseMesh.bodyFaces,hairMeta?.deleteVerts));body.geometry.computeVertexNormals()}
async function build(){clearHair();const h=H[hi];$('name').textContent=h.name;$('count').textContent=`${hi} / ${H.length-1}`;if(!h.id){refreshBodyFaces();msg('Готово · без волос','ok');return}try{msg('Загрузка '+h.name+'…');const a=await asset(h.id);if(!a.m.verts.length)throw Error(`MHCLO: 0 mappings`);if(!a.o.f.length)throw Error('OBJ: 0 faces');const fv=RT.fitMHCLO(a.m,baseMesh.vertices),pos=[],uv=[];for(const tri of a.o.f)for(const c of tri){const k=c[0]*3;if(k+2>=fv.length)continue;pos.push(fv[k],fv[k+1],fv[k+2]);uv.push(...(a.o.uv[c[1]]||[0,0]))}if(!pos.length)throw Error('Fitting: 0 vertices');const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();const mat=new THREE.MeshStandardMaterial({color:0x2a1b16,roughness:.75,side:THREE.DoubleSide});mat.wireframe=hwire;hair=new THREE.Mesh(g,mat);hairMeta=a.m;placeHair();scene.add(hair);refreshBodyFaces();msg(`OK · ${h.name} · map ${a.m.verts.length} · hide ${a.m.deleteVerts.size} body verts`,'ok')}catch(e){console.error(e);msg('ОШИБКА · '+e.message,'err')}}
function ground(first=false){body.position.set(0,0,0);const b=new THREE.Box3().setFromObject(body),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());body.position.set(-c.x,-b.min.y,-c.z);placeHair();cy=s.y*.52;ctl.target.set(0,cy,0);if(first){radius=Math.max(s.y*1.65,s.x*3);view(0);free()}}
function view(i){ctl.enableRotate=false;$('free').classList.remove('active');const a=i*Math.PI/4;cam.position.set(Math.sin(a)*radius,cy+radius*.02,Math.cos(a)*radius);ctl.target.set(0,cy,0);ctl.update()}function free(){ctl.enableRotate=true;$('free').classList.add('active')}
async function load(){msg('Загрузка базового тела…');const r=await fetch(BASE);if(!r.ok)throw Error('base '+r.status);baseMesh=RT.parseBaseOBJ(await r.text());const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(baseMesh.vertices),3));g.setIndex(baseMesh.bodyFaces);g.computeVertexNormals();body=new THREE.Mesh(g,skin);scene.add(body);ground(true);await build()}
$('prev').onclick=()=>{hi=(hi-1+H.length)%H.length;build()};$('next').onclick=()=>{hi=(hi+1)%H.length;build()};$('free').onclick=free;$('wire').onclick=()=>{hwire=!hwire;$('wire').classList.toggle('active',hwire);if(hair)hair.material.wireframe=hwire};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(+b.dataset.v));function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{ctl.update();renderer.render(scene,cam)});load().catch(e=>msg('ОШИБКА · '+e.message,'err'));
</script></body></html>
