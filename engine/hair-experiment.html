<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Live · Hair experiment</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#090c12;--panel:#111722;--line:#2c374b;--text:#edf3ff;--muted:#8997ad;--accent:#75baff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:350px 1fr;height:100vh}.sidebar{background:linear-gradient(180deg,#111722,#0d121b);border-right:1px solid var(--line);padding:18px;overflow:auto}.brand{font-size:18px;font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}.section{margin-top:18px}.sectionTitle{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:#9fb0c8;margin-bottom:8px}.ctrl{padding:10px 11px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:#151d2a}.h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800}.h output{color:#84ceff;font-variant-numeric:tabular-nums}.ends{display:flex;justify-content:space-between;color:#6f7d92;font-size:9px;margin-top:2px}input[type=range]{width:100%;margin:7px 0 0;accent-color:#79b8ff}.hairPicker{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}.hairPicker button{font-size:20px;padding:10px 0}.hairName{text-align:center;border:1px solid var(--line);border-radius:11px;background:#151d2a;padding:10px 6px;font-size:12px;font-weight:900;min-height:42px;display:flex;align-items:center;justify-content:center}.toolbar,.views{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.views{grid-template-columns:repeat(4,1fr)}button{border:1px solid #3a465b;border-radius:10px;background:#20293a;color:#edf3ff;padding:9px 8px;font-size:11px;font-weight:800;cursor:pointer}button.active{background:#355276;border-color:#79b8ff}.stage{position:relative;min-width:0}.stage canvas{display:block;width:100%;height:100%}.badge,.status{position:absolute;left:18px;z-index:4;padding:8px 11px;border:1px solid #303c51;border-radius:11px;background:#111722d9;backdrop-filter:blur(9px);font-size:11px;color:#aebbd0}.badge{top:16px}.status{bottom:16px;max-width:min(900px,calc(100% - 36px))}.status strong{color:#84ceff}.counter{color:#8997ad;font-size:10px;text-align:center;margin-top:7px}@media(max-width:680px){.app{display:block}.sidebar{position:absolute;z-index:10;left:8px;top:8px;width:min(340px,calc(100vw - 16px));max-height:48vh;border:1px solid var(--line);border-radius:14px;background:#111722ee}.stage{height:100vh}}
</style></head><body>
<div class="app"><aside class="sidebar">
<div class="brand">Character Engine · Hair</div><div class="sub">Эксперимент с hm08/MHX2 hair assets. Прическа переключается стрелками.</div>
<div class="section"><div class="sectionTitle">Прическа</div><div class="hairPicker"><button id="prevHair">◀</button><div class="hairName" id="hairName">Без волос</div><button id="nextHair">▶</button></div><div class="counter" id="hairCounter">0 / 3</div></div>
<div class="section"><div class="sectionTitle">Тело</div>
<div class="ctrl"><div class="h"><span>Пол тела</span><output id="genderVal">Ж 100%</output></div><input id="gender" type="range" min="0" max="1" step="0.01" value="0"><div class="ends"><span>Ж</span><span>М</span></div></div>
<div class="ctrl"><div class="h"><span>Возраст</span><output id="ageVal">24 года</output></div><input id="age" type="range" min="0" max="90" step="1" value="24"><div class="ends"><span>0</span><span>90+</span></div></div>
<div class="ctrl"><div class="h"><span>Рост</span><output id="heightVal">50</output></div><input id="height" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="ctrl"><div class="h"><span>Вес</span><output id="weightVal">50</output></div><input id="weight" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="ctrl"><div class="h"><span>Мышцы</span><output id="muscleVal">50</output></div><input id="muscle" type="range" min="0" max="1" step="0.01" value="0.5"></div>
</div>
<div class="section"><div class="sectionTitle">Просмотр</div><div class="toolbar"><button id="free" class="active">Свободное вращение</button><button id="wire">Сетка</button><button id="reset">Сбросить</button><button id="hairLight">Светлые волосы</button></div></div>
<div class="section"><div class="views"><button data-view="0">Спереди</button><button data-view="2">Справа</button><button data-view="4">Сзади</button><button data-view="6">Слева</button><button data-view="1">3/4 ↗</button><button data-view="3">3/4 ↘</button><button data-view="5">3/4 ↙</button><button data-view="7">3/4 ↖</button></div></div>
</aside><main class="stage" id="stage"><div class="badge">hm08 · MHX2 particle hair → Three.js strands</div><div class="status" id="status">Загрузка…</div></main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const LOCAL='./anny/mpfb2',REMOTE='https://raw.githubusercontent.com/naver/anny/main/src/anny/data/mpfb2',BASE=LOCAL+'/3dobjs/base.obj',M=REMOTE+'/targets/macrodetails';
const HAIRROOT='https://raw.githubusercontent.com/makehumancommunity/mhx2-makehuman-exchange/master/import_runtime_mhx2/data/hm8/hair';
const HAIRS=[
 {name:'Без волос',file:null},
 {name:'Half Long',file:'female_half_long.mxa'},
 {name:'Half Long 2',file:'female_half_long_2.mxa'},
 {name:'Long Tetine',file:'female_long_tetine.mxa'}
];
const $=id=>document.getElementById(id),stage=$('stage'),status=$('status');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.enablePan=true;scene.background=new THREE.Color(0x090c12);scene.add(new THREE.HemisphereLight(0xe9f1ff,0x17141c,2.3));let dl=new THREE.DirectionalLight(0xffdfca,3.2);dl.position.set(-4,7,5);scene.add(dl);dl=new THREE.DirectionalLight(0x8db6ff,1.7);dl.position.set(5,3,-5);scene.add(dl);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.4,64),new THREE.MeshStandardMaterial({color:0x141b28,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(5,30,0x34425a,0x1c2432);grid.position.y=.004;grid.material.transparent=true;grid.material.opacity=.38;scene.add(grid);
const skinMat=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,side:THREE.DoubleSide});let hairMat=new THREE.LineBasicMaterial({color:0x211712,transparent:true,opacity:.96});
let bodyMesh=null,baseVerts=null,currentVerts=null,hairObj=null,hairIndex=0,hairLight=false,wire=false,radius=5,centerY=1,frontOffset=Math.PI,buildId=0,timer=0;const targetCache=new Map(),hairCache=new Map();
function parseOBJ(t){const v=[],idx=[];let group='';for(const raw of t.split(/\r?\n/)){const s=raw.trim();if(!s||s[0]==='#')continue;if(s.startsWith('g ')){group=s.slice(2).trim();continue}if(s.startsWith('v ')){const p=s.split(/\s+/);v.push(+p[1],+p[2],+p[3])}else if(group==='body'&&s.startsWith('f ')){const p=s.slice(2).trim().split(/\s+/).map(x=>parseInt(x.split('/')[0])-1);for(let i=1;i<p.length-1;i++)idx.push(p[0],p[i],p[i+1])}}return{v:new Float32Array(v),idx}}
async function gz(url,opt=false){if(targetCache.has(url))return targetCache.get(url);const p=(async()=>{const r=await fetch(url,{cache:'force-cache'});if(!r.ok){if(opt&&r.status===404)return null;throw Error(r.status+' '+url.split('/').pop())}return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text()})();targetCache.set(url,p);return p}
function add(v,t,w){if(!t||w<=0)return;for(const raw of t.split(/\r?\n/)){const p=raw.trim().split(/\s+/);if(p.length<4||p[0][0]==='#')continue;const i=+p[0]*3;if(i+2>=v.length)continue;v[i]+=+p[1]*w;v[i+1]+=+p[2]*w;v[i+2]+=+p[3]*w}}
function tri(x,n){return x<=.5?[[n[0],1-x*2],[n[1],x*2]].filter(a=>a[1]>1e-6):[[n[1],2-x*2],[n[2],x*2-1]].filter(a=>a[1]>1e-6)}function bi(x,n){return[[n[0],1-x],[n[1],x]].filter(a=>a[1]>1e-6)}
function ageBlend(y){const pts=[[1,'baby'],[10,'child'],[25,'young'],[70,'old']];if(y<=1)return[['baby',1]];for(let i=0;i<pts.length-1;i++){const[a,an]=pts[i],[b,bn]=pts[i+1];if(y<=b){const t=(y-a)/(b-a);return[[an,1-t],[bn,t]].filter(q=>q[1]>1e-6)}}return[['old',1]]}
async function target(url,v,w,opt=false){if(w>1e-6)add(v,await gz(url,opt),w)}
function labels(){const g=+$('gender').value;$('genderVal').value=g<.5?`Ж ${Math.round((1-g)*100)}%`:`М ${Math.round(g*100)}%`;$('ageVal').value=`${$('age').value} лет`;for(const k of['height','weight','muscle'])$(k+'Val').value=Math.round(+$(k).value*100)}
function fitPoint(row,v){const[vn,w,o]=row;let x=0,y=0,z=0;for(let n=0;n<3;n++){const k=vn[n]*3;x+=w[n]*v[k];y+=w[n]*v[k+1];z+=w[n]*v[k+2]}return[x+o[0],y+o[1],z+o[2]]}
async function getHairAsset(i){const h=HAIRS[i];if(!h.file)return null;if(hairCache.has(h.file))return hairCache.get(h.file);const p=fetch(`${HAIRROOT}/${h.file}`,{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('hair '+r.status);return r.json()});hairCache.set(h.file,p);return p}
function clearHair(){if(!hairObj)return;scene.remove(hairObj);hairObj.geometry.dispose();hairObj=null}
async function buildHair(){clearHair();$('hairName').textContent=HAIRS[hairIndex].name;$('hairCounter').textContent=`${hairIndex} / ${HAIRS.length-1}`;if(hairIndex===0||!currentVerts)return;status.textContent='Строю прическу…';const data=await getHairAsset(hairIndex),pos=[];for(const sys of data.particle_systems||[]){const fit=sys.fitting||[],hairs=sys.hairs||[];if(!hairs.length)continue;const hlen=hairs[0].length||0;if(!hlen)continue;const pts=fit.map(r=>fitPoint(r,currentVerts));for(let h=0;h<hairs.length;h++){const start=h*hlen;for(let k=0;k<hlen-1;k++){const a=pts[start+k],b=pts[start+k+1];if(!a||!b)continue;pos.push(a[0],a[1],a[2],b[0],b[1],b[2])}}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));hairMat=new THREE.LineBasicMaterial({color:hairLight?0xb69a72:0x211712,transparent:true,opacity:.96});hairObj=new THREE.LineSegments(g,hairMat);hairObj.position.copy(bodyMesh.position);scene.add(hairObj);status.innerHTML=`<strong>Готово</strong> · ${HAIRS[hairIndex].name} · ${Math.round(pos.length/6)} сегментов`}
async function rebuild(){if(!bodyMesh)return;const id=++buildId;labels();status.textContent='Пересобираю тело…';const v=new Float32Array(baseVerts),gg=bi(+$('gender').value,['female','male']),aa=ageBlend(+$('age').value),mw=tri(+$('muscle').value,['minmuscle','averagemuscle','maxmuscle']),ww=tri(+$('weight').value,['minweight','averageweight','maxweight']),hh=bi(+$('height').value,['minheight','maxheight']);try{for(const[g,wg]of gg)for(const[a,wa]of aa){const ga=wg*wa;for(const r of['african','asian','caucasian'])await target(`${M}/${r}-${g}-${a}.target.gz`,v,ga/3,true);for(const[m,wm]of mw)for(const[w,wwt]of ww){const q=ga*wm*wwt;await target(`${M}/universal-${g}-${a}-${m}-${w}.target.gz`,v,q,true);for(const[h,wh]of hh)await target(`${M}/height/${g}-${a}-${m}-${w}-${h}.target.gz`,v,q*wh,true)}}if(id!==buildId)return;currentVerts=v;bodyMesh.geometry.attributes.position.array.set(v);bodyMesh.geometry.attributes.position.needsUpdate=true;bodyMesh.geometry.computeVertexNormals();fitBody(false);await buildHair();if(hairIndex===0)status.innerHTML='<strong>Готово</strong> · без волос';}catch(e){console.error(e);status.textContent='Ошибка: '+e.message}}
function fitBody(first=false){bodyMesh.position.set(0,0,0);if(hairObj)hairObj.position.set(0,0,0);const b=new THREE.Box3().setFromObject(bodyMesh),size=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),off=new THREE.Vector3(-c.x,-b.min.y,-c.z);bodyMesh.position.copy(off);if(hairObj)hairObj.position.copy(off);centerY=size.y*.52;controls.target.set(0,centerY,0);const footprint=Math.max(size.x,size.z);floor.scale.setScalar(footprint*.75);grid.scale.setScalar(footprint*.75);if(first){radius=Math.max(size.y*1.65,size.x*3.1,size.z*3.1);controls.minDistance=size.y*.55;controls.maxDistance=size.y*7;setView(0);setFree()}controls.update()}
function setView(i){controls.enableRotate=false;$('free').classList.remove('active');const a=frontOffset+i*Math.PI/4;camera.position.set(Math.sin(a)*radius,centerY+radius*.025,Math.cos(a)*radius);controls.target.set(0,centerY,0);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',+b.dataset.view===i))}function setFree(){controls.enableRotate=true;$('free').classList.add('active');document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'))}
async function load(){const r=await fetch(BASE,{cache:'force-cache'});if(!r.ok)throw Error('base '+r.status);const p=parseOBJ(await r.text());baseVerts=new Float32Array(p.v);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(baseVerts),3));g.setIndex(p.idx);g.computeVertexNormals();bodyMesh=new THREE.Mesh(g,skinMat);scene.add(bodyMesh);fitBody(true);await rebuild()}
for(const k of['gender','age','height','weight','muscle'])$(k).oninput=()=>{clearTimeout(timer);labels();timer=setTimeout(rebuild,70)};$('prevHair').onclick=async()=>{hairIndex=(hairIndex-1+HAIRS.length)%HAIRS.length;await buildHair()};$('nextHair').onclick=async()=>{hairIndex=(hairIndex+1)%HAIRS.length;await buildHair()};$('free').onclick=setFree;$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);skinMat.wireframe=wire};$('hairLight').onclick=async()=>{hairLight=!hairLight;$('hairLight').classList.toggle('active',hairLight);await buildHair()};$('reset').onclick=()=>{$('gender').value=0;$('age').value=24;$('height').value=.5;$('weight').value=.5;$('muscle').value=.5;hairIndex=0;hairLight=false;$('hairLight').classList.remove('active');rebuild()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(+b.dataset.view));function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});load().catch(e=>{console.error(e);status.textContent='Ошибка загрузки: '+e.message});
</script></body></html>
