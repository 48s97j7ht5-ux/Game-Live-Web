<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game Live · Pose test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;--bg:#090c12;--panel:#111722;--line:#334158;--text:#eef4ff;--muted:#9aa9bf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:350px 1fr;height:100vh}.side{padding:16px;background:#111722;border-right:1px solid var(--line);overflow:auto;z-index:10}.title{font-weight:900;font-size:17px}.small{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px}.poses{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}.tools,.views{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.views{grid-template-columns:repeat(4,1fr)}button{border:1px solid #3a465b;border-radius:9px;background:#20293a;color:#edf3ff;padding:10px 8px;font-size:11px;font-weight:800}.active{background:#355276;border-color:#79b8ff}.diag{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#171f2d;padding:10px;font-size:11px;line-height:1.35}.diag.ok{border-color:#315f48}.diag.err{border-color:#8a3940;color:#ffd5d8}.stage{position:relative;min-width:0}.stage canvas{display:block;width:100%;height:100%}.badge{position:absolute;left:14px;top:14px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#111722dd;font-size:10px;color:#aebbd0}@media(max-width:680px){.app{display:block}.side{position:absolute;left:6px;top:6px;width:min(350px,calc(100vw - 12px));max-height:44vh;padding:11px;border:1px solid var(--line);border-radius:13px;background:#111722ef}.title{font-size:14px}.small{display:none}.stage{height:100vh}.badge{display:none}.poses{grid-template-columns:repeat(3,1fr)}.poses button{padding:8px 5px}}
</style></head><body><div class="app"><aside class="side"><div class="title">Pose Prototype · hm08</div><div class="small">Три статические позы. Тело и бельё получают одну и ту же деформацию. Высота в кадре — 400 px.</div><div class="poses"><button data-pose="neutral" class="active">Нейтральная</button><button data-pose="casual">Живая стойка</button><button data-pose="sit">Полусидя</button></div><div class="tools"><button id="free" class="active">Крутить</button><button id="wire">Сетка</button></div><div class="views"><button data-v="0">Перед</button><button data-v="2">Право</button><button data-v="4">Зад</button><button data-v="6">Лево</button></div><div class="diag" id="diag">Загрузка…</div></aside><main class="stage" id="stage"><div class="badge">pose prototype v1 · shared deformation · 400 px</div></main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const BASE='./anny/mpfb2/3dobjs/base.obj',ROOT='./clothes/underwear',TARGET_PX=400;
const $=x=>document.getElementById(x),stage=$('stage'),diag=$('diag');let body=null,bv=null,bodyRest=null,top=null,bottom=null,pose='neutral',wire=false,bodyHeight=1,bodyCenterY=.5,radius=5;const cache=new Map();
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x090c12);const cam=new THREE.PerspectiveCamera(30,1,.01,100),ctl=new OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x222233,2.2));const dl=new THREE.DirectionalLight(0xffddcc,2.6);dl.position.set(-4,7,5);scene.add(dl);const skin=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,side:THREE.DoubleSide});
function msg(s,type=''){diag.className='diag '+type;diag.textContent=s}
function baseOBJ(t){const v=[],f=[];let g='';for(const l of t.split(/\r?\n/)){const s=l.trim();if(s.startsWith('g '))g=s.slice(2).trim();else if(s.startsWith('v ')){const p=s.split(/\s+/);v.push(+p[1],+p[2],+p[3])}else if(g==='body'&&s.startsWith('f ')){const p=s.slice(2).split(/\s+/).map(x=>parseInt(x)-1);for(let i=1;i<p.length-1;i++)f.push(p[0],p[i],p[i+1])}}return{v:new Float32Array(v),f}}
function obj(t){const v=[],f=[];for(const l of t.split(/\r?\n/)){const s=l.trim(),p=s.split(/\s+/);if(s.startsWith('v '))v.push([+p[1],+p[2],+p[3]]);else if(s.startsWith('f ')){const q=p.slice(1).map(x=>parseInt(x.split('/')[0])-1);for(let i=1;i<q.length-1;i++)f.push([q[0],q[i],q[i+1]])}}return{v,f}}
function mhclo(t){const o={verts:[],x:null,y:null,z:null};for(const l of t.split(/\r?\n/)){const s=l.trim();if(!s||s[0]==='#')continue;const p=s.split(/\s+/);if(p[0]==='x_scale')o.x=[+p[1],+p[2],+p[3]];else if(p[0]==='y_scale')o.y=[+p[1],+p[2],+p[3]];else if(p[0]==='z_scale')o.z=[+p[1],+p[2],+p[3]];else if(/^\d+$/.test(p[0])){if(p.length===1)o.verts.push({i:[+p[0],+p[0],+p[0]],w:[1,0,0],o:[0,0,0]});else if(p.length>=9)o.verts.push({i:[+p[0],+p[1],+p[2]],w:[+p[3],+p[4],+p[5]],o:[+p[6],+p[7],+p[8]]})}}return o}
function scale(r,a){if(!r)return 1;return Math.abs((bv[r[1]*3+a]-bv[r[0]*3+a])/r[2])}function fitVerts(m){const S=[scale(m.x,0),scale(m.y,1),scale(m.z,2)];return m.verts.map(q=>{const x=[0,0,0];for(let n=0;n<3;n++){const k=q.i[n]*3,w=q.w[n];x[0]+=bv[k]*w;x[1]+=bv[k+1]*w;x[2]+=bv[k+2]*w}return[x[0]+q.o[0]*S[0],x[1]+q.o[1]*S[1],x[2]+q.o[2]*S[2]]})}
function rotX(p,c,a){const y=p[1]-c[1],z=p[2]-c[2],s=Math.sin(a),co=Math.cos(a);p[1]=c[1]+y*co-z*s;p[2]=c[2]+y*s+z*co}function rotZ(p,c,a){const x=p[0]-c[0],y=p[1]-c[1],s=Math.sin(a),co=Math.cos(a);p[0]=c[0]+x*co-y*s;p[1]=c[1]+x*s+y*co}
function deformPoint(x,y,z,kind){const p=[x,y,z],H=bodyHeight||1;const yn=y/H; if(kind==='neutral')return p;
 if(kind==='casual'){
   if(yn>.44){const t=Math.min(1,(yn-.44)/.35),a=(x>=0?-1:1)*0.05*t;rotZ(p,[0,.48*H,0],a)}
   if(yn>.40&&yn<.73&&Math.abs(x)>.14*H){const side=x>0?1:-1;rotZ(p,[side*.17*H,.67*H,0],side*(x>0?-0.10:0.16));}
   if(yn<.50&&x>0.02*H){rotZ(p,[.07*H,.49*H,0],-0.05)}
   return p;
 }
 if(kind==='sit'){
   if(yn>.50){rotX(p,[0,.50*H,0],-0.13)}
   if(yn<.50){const side=x>=0?1:-1;rotX(p,[side*.08*H,.50*H,0],0.78)}
   if(yn<.28){const side=x>=0?1:-1;rotX(p,[side*.08*H,.27*H,.10*H],-1.02)}
   p[1]+=0.03*H;return p;
 } return p;}
function deformArray(rest,out){for(let i=0;i<rest.length;i+=3){const p=deformPoint(rest[i],rest[i+1],rest[i+2],pose);out[i]=p[0];out[i+1]=p[1];out[i+2]=p[2]}}
function applyPose(){if(!body)return;const a=body.geometry.attributes.position.array;deformArray(bodyRest,a);body.geometry.attributes.position.needsUpdate=true;body.geometry.computeVertexNormals();for(const m of[top,bottom])if(m){deformArray(m.userData.rest,m.geometry.attributes.position.array);m.geometry.attributes.position.needsUpdate=true;m.geometry.computeVertexNormals()}ground();document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('active',b.dataset.pose===pose));msg('Готово · '+({neutral:'нейтральная',casual:'живая стойка',sit:'полусидя'}[pose])+' · бельё следует за той же деформацией','ok')}
async function txt(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${url}`);return r.text()}
async function loadCloth(kind,id,color){try{const root=`${ROOT}/${kind}/${id}`,[mt,ot]=await Promise.all([txt(`${root}/${id}.mhclo`),txt(`${root}/${id}.obj`)]),m=mhclo(mt),o=obj(ot),fv=fitVerts(m),pos=[];for(const tri of o.f)for(const ix of tri){const v=fv[ix]||o.v[ix];if(v)pos.push(...v)}if(!pos.length)throw Error(id+' 0 vertices');const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.7,side:THREE.DoubleSide}));mesh.userData.rest=new Float32Array(pos);scene.add(mesh);return mesh}catch(e){console.warn(e);return null}}
function fitCamera(){const h=Math.max(stage.clientHeight,1),fov=THREE.MathUtils.degToRad(cam.fov),d=bodyHeight*h/(2*TARGET_PX*Math.tan(fov/2));radius=Math.max(d,bodyHeight*.8);cam.position.set(0,bodyCenterY,radius);ctl.target.set(0,bodyCenterY,0);ctl.minDistance=radius*.45;ctl.maxDistance=radius*5;ctl.update()}
function ground(){for(const m of[body,top,bottom])if(m)m.position.set(0,0,0);const b=new THREE.Box3().setFromObject(body),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),off=new THREE.Vector3(-c.x,-b.min.y,-c.z);for(const m of[body,top,bottom])if(m)m.position.copy(off);bodyHeight=s.y;bodyCenterY=s.y*.5;fitCamera()}
function view(i){ctl.enableRotate=false;$('free').classList.remove('active');const a=Math.PI+i*Math.PI/4;cam.position.set(Math.sin(a)*radius,bodyCenterY,Math.cos(a)*radius);ctl.target.set(0,bodyCenterY,0);ctl.update()}function free(){ctl.enableRotate=true;$('free').classList.add('active')}
async function load(){const r=await fetch(BASE);if(!r.ok)throw Error('base '+r.status);const p=baseOBJ(await r.text());bv=p.v;bodyRest=new Float32Array(bv);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(bv),3));g.setIndex(p.f);g.computeVertexNormals();body=new THREE.Mesh(g,skin);scene.add(body);const bb=new THREE.Box3().setFromObject(body),sz=bb.getSize(new THREE.Vector3());bodyHeight=sz.y;top=await loadCloth('top','joepal_plain_bra',0xc97b9f);bottom=await loadCloth('bottom','elvs_bow_bottom_panty',0x7396c8);applyPose();free()}
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{pose=b.dataset.pose;applyPose()});$('free').onclick=free;$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);for(const m of[body,top,bottom])if(m)m.material.wireframe=wire};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(+b.dataset.v));function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);cam.aspect=stage.clientWidth/stage.clientHeight;cam.updateProjectionMatrix();if(body)fitCamera()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{ctl.update();renderer.render(scene,cam)});load().catch(e=>msg('ОШИБКА · '+e.message,'err'));
</script></body></html>
