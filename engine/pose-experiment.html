<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game Live · MPFB rig test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;--bg:#090c12;--panel:#111722;--line:#334158;--text:#eef4ff;--muted:#9aa9bf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:350px 1fr;height:100vh}.side{padding:16px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;z-index:10}.title{font-weight:900;font-size:17px}.small{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px}.poses,.tools,.views{display:grid;gap:8px;margin-top:12px}.poses,.tools{grid-template-columns:1fr 1fr}.views{grid-template-columns:repeat(4,1fr)}button{border:1px solid #3a465b;border-radius:9px;background:#20293a;color:#edf3ff;padding:10px 8px;font-size:11px;font-weight:800}.active{background:#355276;border-color:#79b8ff}.diag{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#171f2d;padding:10px;font-size:11px;line-height:1.4;white-space:pre-line}.diag.ok{border-color:#315f48}.diag.err{border-color:#8a3940;color:#ffd5d8}.stage{position:relative;min-width:0}.stage canvas{display:block;width:100%;height:100%}.badge{position:absolute;left:14px;top:14px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#111722dd;font-size:10px;color:#aebbd0}@media(max-width:680px){.app{display:block}.side{position:absolute;left:6px;top:6px;width:min(350px,calc(100vw - 12px));max-height:43vh;padding:11px;border:1px solid var(--line);border-radius:13px;background:#111722ef}.title{font-size:14px}.small{display:none}.stage{height:100vh}.badge{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="title">MPFB Rig · documentation port</div><div class="small">Порядок как в MPFB: basemesh → rig from current mesh → MHCLO fit → transfer skin weights → pose → body + clothes skinning.</div><div class="poses"><button data-pose="rest" class="active">Rest</button><button data-pose="tpose">Anny T-pose</button></div><div class="tools"><button id="free" class="active">Крутить</button><button id="wire">Сетка</button></div><div class="views"><button data-v="0">Перед</button><button data-v="2">Право</button><button data-v="4">Зад</button><button data-v="6">Лево</button></div><div class="diag" id="diag">Загрузка…</div></aside><main class="stage" id="stage"><div class="badge">MPFB port v3 · matched rig/weights · 400 px</div></main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {parseBaseOBJ,parseOBJ,parseMHCLO,buildRig,buildSkinMatrices,buildVertexInfluences,skinVertices,fitMHCLO,transferInfluencesToMHCLO,expandIndexedCloth,expandIndexedInfluences} from './mpfb-runtime.js?v=20260815-1';

const BASE='./anny/mpfb2/3dobjs/base.obj';
const RIG='./anny/mpfb2/rigs/standard/rig.game_engine_with_breast.json';
const WEIGHTS='./anny/mpfb2/rigs/standard/weights.game_engine_with_breast.json';
const TPOSE='./poses/official/anny-t-pose.json';
const CLOTH='./clothes/underwear',TARGET_PX=400;
const $=x=>document.getElementById(x),stage=$('stage'),diag=$('diag');
let baseMesh,rig,bones,weights,baseInfluences,tPose,body,top,bottom,topData,bottomData,pose='rest',wire=false,bodyHeight=1,bodyCenterY=.5,radius=5;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090c12);const cam=new THREE.PerspectiveCamera(30,1,.01,100),ctl=new OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x222233,2.2));const dl=new THREE.DirectionalLight(0xffddcc,2.6);dl.position.set(-4,7,5);scene.add(dl);
const skinMat=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,side:THREE.DoubleSide});
function msg(s,type=''){diag.className='diag '+type;diag.textContent=s}
async function txt(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${url}`);return r.text()}
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${url}`);return r.json()}
function geometry(pos,index=null){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));if(index)g.setIndex(index);g.computeVertexNormals();return g}
async function readCloth(kind,id){const root=`${CLOTH}/${kind}/${id}`,mh=await txt(`${root}/${id}.mhclo`),meta=parseMHCLO(mh),objName=(meta.objFile||`${id}.obj`).split(/[\\/]/).pop(),mesh=parseOBJ(await txt(`${root}/${objName}`));return{id,meta,mesh}}
function prepareCloth(data,color){const fitted=fitMHCLO(data.meta,baseMesh.vertices),vinf=transferInfluencesToMHCLO(data.meta,baseInfluences),expandedRest=expandIndexedCloth(data.mesh,fitted),expandedInf=expandIndexedInfluences(data.mesh,vinf),mesh=new THREE.Mesh(geometry(expandedRest),new THREE.MeshStandardMaterial({color,roughness:.72,side:THREE.DoubleSide,wireframe:wire}));mesh.userData.rest=expandedRest;mesh.userData.inf=expandedInf;scene.add(mesh);return mesh}
function applyPose(){
  const p=pose==='tpose'?tPose:null,skin=buildSkinMatrices(bones,p),bodyPos=skinVertices(baseMesh.vertices,baseInfluences,skin);body.geometry.attributes.position.array.set(bodyPos);body.geometry.attributes.position.needsUpdate=true;body.geometry.computeVertexNormals();
  for(const m of [top,bottom]){const out=skinVertices(m.userData.rest,m.userData.inf,skin);m.geometry.attributes.position.array.set(out);m.geometry.attributes.position.needsUpdate=true;m.geometry.computeVertexNormals()}
  ground();document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('active',b.dataset.pose===pose));msg(`${pose==='rest'?'Rest pose':'Anny T-pose'}\nrig: game_engine_with_breast\npositions: CUBE / VERTEX / MEAN / XYZ\nclothes: MHCLO fitted before pose + transferred weights`,'ok');
}
function fitCamera(){const h=Math.max(stage.clientHeight,1),fov=THREE.MathUtils.degToRad(cam.fov),d=bodyHeight*h/(2*TARGET_PX*Math.tan(fov/2));radius=Math.max(d,bodyHeight*.8);cam.position.set(0,bodyCenterY,radius);ctl.target.set(0,bodyCenterY,0);ctl.minDistance=radius*.45;ctl.maxDistance=radius*5;ctl.update()}
function ground(){for(const m of [body,top,bottom])if(m)m.position.set(0,0,0);const b=new THREE.Box3().setFromObject(body),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),off=new THREE.Vector3(-c.x,-b.min.y,-c.z);for(const m of [body,top,bottom])if(m)m.position.copy(off);bodyHeight=s.y;bodyCenterY=s.y*.5;fitCamera()}
function view(i){ctl.enableRotate=false;$('free').classList.remove('active');const a=Math.PI+i*Math.PI/4;cam.position.set(Math.sin(a)*radius,bodyCenterY,Math.cos(a)*radius);ctl.target.set(0,bodyCenterY,0);ctl.update()}function free(){ctl.enableRotate=true;$('free').classList.add('active')}
async function load(){
  msg('Загрузка hm08 + matching Anny rig/weights…');
  const [bt,r,w,p,ct,cb]=await Promise.all([txt(BASE),json(RIG),json(WEIGHTS),json(TPOSE),readCloth('top','joepal_plain_bra'),readCloth('bottom','elvs_bow_bottom_panty')]);
  baseMesh=parseBaseOBJ(bt);rig=r;weights=w;tPose=p;bones=buildRig(rig,baseMesh);baseInfluences=buildVertexInfluences(weights,baseMesh.vertices.length/3);
  body=new THREE.Mesh(geometry(new Float32Array(baseMesh.vertices),baseMesh.bodyFaces),skinMat);scene.add(body);topData=ct;bottomData=cb;top=prepareCloth(topData,0xc97b9f);bottom=prepareCloth(bottomData,0x7396c8);applyPose();free();
}
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{pose=b.dataset.pose;applyPose()});$('free').onclick=free;$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);for(const m of [body,top,bottom])if(m)m.material.wireframe=wire};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(+b.dataset.v));function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);cam.aspect=stage.clientWidth/stage.clientHeight;cam.updateProjectionMatrix();if(body)fitCamera()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{ctl.update();renderer.render(scene,cam)});load().catch(e=>{console.error(e);msg('ОШИБКА · '+e.message,'err')});
</script></body></html>
