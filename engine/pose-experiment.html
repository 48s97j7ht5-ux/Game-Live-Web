<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game Live · Official rig pose test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;--bg:#090c12;--panel:#111722;--line:#334158;--text:#eef4ff;--muted:#9aa9bf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:350px 1fr;height:100vh}.side{padding:16px;background:#111722;border-right:1px solid var(--line);overflow:auto;z-index:10}.title{font-weight:900;font-size:17px}.small{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px}.poses{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.tools,.views{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.views{grid-template-columns:repeat(4,1fr)}button{border:1px solid #3a465b;border-radius:9px;background:#20293a;color:#edf3ff;padding:10px 8px;font-size:11px;font-weight:800}.active{background:#355276;border-color:#79b8ff}.diag{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#171f2d;padding:10px;font-size:11px;line-height:1.4;white-space:pre-line}.diag.ok{border-color:#315f48}.diag.err{border-color:#8a3940;color:#ffd5d8}.stage{position:relative;min-width:0}.stage canvas{display:block;width:100%;height:100%}.badge{position:absolute;left:14px;top:14px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#111722dd;font-size:10px;color:#aebbd0}@media(max-width:680px){.app{display:block}.side{position:absolute;left:6px;top:6px;width:min(350px,calc(100vw - 12px));max-height:42vh;padding:11px;border:1px solid var(--line);border-radius:13px;background:#111722ef}.title{font-size:14px}.small{display:none}.stage{height:100vh}.badge{display:none}.poses button{padding:8px 5px}}
</style></head><body><div class="app"><aside class="side"><div class="title">Official Anny Rig · hm08</div><div class="small">Без ручной деформации вершин. Используются официальный game_engine rig, официальные skin weights и pose JSON из Anny. Бельё заново fitted по уже posed-телу.</div><div class="poses"><button data-pose="rest" class="active">Исходная</button><button data-pose="tpose">Anny T-pose</button></div><div class="tools"><button id="free" class="active">Крутить</button><button id="wire">Сетка</button></div><div class="views"><button data-v="0">Перед</button><button data-v="2">Право</button><button data-v="4">Зад</button><button data-v="6">Лево</button></div><div class="diag" id="diag">Загрузка официального рига…</div></aside><main class="stage" id="stage"><div class="badge">official rig v2 · LBS · 400 px</div></main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const BASE='./anny/mpfb2/3dobjs/base.obj';
const RIG='./anny/mpfb2/rigs/standard/rig.game_engine.json';
const WEIGHTS='./anny/mpfb2/rigs/standard/weights.game_engine.json';
const TPOSE='./poses/official/anny-t-pose.json';
const CLOTH='./clothes/underwear',TARGET_PX=400;
const $=x=>document.getElementById(x),stage=$('stage'),diag=$('diag');
let body=null,baseVerts=null,posedVerts=null,faces=null,top=null,bottom=null,clothTopData=null,clothBottomData=null,rig=null,weights=null,tPose=null,pose='rest',wire=false,bodyHeight=1,bodyCenterY=.5,radius=5;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090c12);const cam=new THREE.PerspectiveCamera(30,1,.01,100),ctl=new OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x222233,2.2));const dl=new THREE.DirectionalLight(0xffddcc,2.6);dl.position.set(-4,7,5);scene.add(dl);const skin=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,side:THREE.DoubleSide});
function msg(s,type=''){diag.className='diag '+type;diag.textContent=s}
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${url}`);return r.json()}async function txt(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${url}`);return r.text()}
function baseOBJ(t){const v=[],f=[];let g='';for(const l of t.split(/\r?\n/)){const s=l.trim();if(s.startsWith('g '))g=s.slice(2).trim();else if(s.startsWith('v ')){const p=s.split(/\s+/);v.push(+p[1],+p[2],+p[3])}else if(g==='body'&&s.startsWith('f ')){const p=s.slice(2).split(/\s+/).map(x=>parseInt(x)-1);for(let i=1;i<p.length-1;i++)f.push(p[0],p[i],p[i+1])}}return{v:new Float32Array(v),f}}
function obj(t){const v=[],f=[];for(const l of t.split(/\r?\n/)){const s=l.trim(),p=s.split(/\s+/);if(s.startsWith('v '))v.push([+p[1],+p[2],+p[3]]);else if(s.startsWith('f ')){const q=p.slice(1).map(x=>parseInt(x.split('/')[0])-1);for(let i=1;i<q.length-1;i++)f.push([q[0],q[i],q[i+1]])}}return{v,f}}
function mhclo(t){const o={verts:[],x:null,y:null,z:null};for(const l of t.split(/\r?\n/)){const s=l.trim();if(!s||s[0]==='#')continue;const p=s.split(/\s+/);if(p[0]==='x_scale')o.x=[+p[1],+p[2],+p[3]];else if(p[0]==='y_scale')o.y=[+p[1],+p[2],+p[3]];else if(p[0]==='z_scale')o.z=[+p[1],+p[2],+p[3]];else if(/^\d+$/.test(p[0])){if(p.length===1)o.verts.push({i:[+p[0],+p[0],+p[0]],w:[1,0,0],o:[0,0,0]});else if(p.length>=9)o.verts.push({i:[+p[0],+p[1],+p[2]],w:[+p[3],+p[4],+p[5]],o:[+p[6],+p[7],+p[8]]})}}return o}
// Anny rig data is in Blender coordinates. hm08 OBJ uses MakeHuman coordinates.
// Conversion used by MPFB: rig(x,y,z) <-> obj(x,-z,-y).
function objToRig(v){return new THREE.Vector3(v.x,-v.z,-v.y)}function rigToObj(v){return new THREE.Vector3(v.x,-v.z,-v.y)}
function boneFrame(def){const h=new THREE.Vector3(...def.head.default_position),t=new THREE.Vector3(...def.tail.default_position),y=t.clone().sub(h).normalize();let x=new THREE.Vector3(1,0,0);if(Math.abs(x.dot(y))>.96)x.set(0,0,1);let z=new THREE.Vector3().crossVectors(x,y).normalize();x=new THREE.Vector3().crossVectors(y,z).normalize();if(def.roll){const q=new THREE.Quaternion().setFromAxisAngle(y,def.roll);x.applyQuaternion(q);z.applyQuaternion(q)}const m=new THREE.Matrix4();m.makeBasis(x,y,z);m.setPosition(h);return m}
function buildSkinMatrices(poseData){const names=Object.keys(rig),restWorld={},posedWorld={},skinM={};for(const name of names)restWorld[name]=boneFrame(rig[name]);const pending=new Set(names);let guard=0;while(pending.size&&guard++<names.length*3){for(const name of [...pending]){const d=rig[name],parent=d.parent;if(parent&&pending.has(parent))continue;const rw=restWorld[name],local=parent?new THREE.Matrix4().copy(restWorld[parent]).invert().multiply(rw):rw.clone();const rot=(poseData?.bone_rotations||{})[name];const tr=(poseData?.bone_translations||{})[name];const delta=new THREE.Matrix4();const q=rot?new THREE.Quaternion().setFromEuler(new THREE.Euler(rot[0],rot[1],rot[2],'XYZ')):new THREE.Quaternion();delta.compose(new THREE.Vector3(...(tr||[0,0,0])),q,new THREE.Vector3(1,1,1));const plocal=local.clone().multiply(delta);posedWorld[name]=parent?posedWorld[parent].clone().multiply(plocal):plocal;skinM[name]=posedWorld[name].clone().multiply(restWorld[name].clone().invert());pending.delete(name)}}return skinM}
function skinBody(poseData){if(!poseData){posedVerts.set(baseVerts);return}const mats=buildSkinMatrices(poseData),acc=new Float32Array(baseVerts.length),sum=new Float32Array(baseVerts.length/3),v=new THREE.Vector3(),r=new THREE.Vector3();for(const [bone,pairs] of Object.entries(weights.weights||{})){const m=mats[bone];if(!m)continue;for(const pair of pairs){const i=pair[0],w=pair[1];if(i*3+2>=baseVerts.length||w<=0)continue;v.set(baseVerts[i*3],baseVerts[i*3+1],baseVerts[i*3+2]);r.copy(objToRig(v)).applyMatrix4(m);const o=rigToObj(r),k=i*3;acc[k]+=o.x*w;acc[k+1]+=o.y*w;acc[k+2]+=o.z*w;sum[i]+=w}}for(let i=0;i<sum.length;i++){const k=i*3,s=sum[i];if(s>1e-7){posedVerts[k]=acc[k]/s;posedVerts[k+1]=acc[k+1]/s;posedVerts[k+2]=acc[k+2]/s}else{posedVerts[k]=baseVerts[k];posedVerts[k+1]=baseVerts[k+1];posedVerts[k+2]=baseVerts[k+2]}}}
function scaleRef(r,a){if(!r)return 1;return Math.abs((posedVerts[r[1]*3+a]-posedVerts[r[0]*3+a])/r[2])}function fitVerts(m){const S=[scaleRef(m.x,0),scaleRef(m.y,1),scaleRef(m.z,2)];return m.verts.map(q=>{const x=[0,0,0];for(let n=0;n<3;n++){const k=q.i[n]*3,w=q.w[n];x[0]+=posedVerts[k]*w;x[1]+=posedVerts[k+1]*w;x[2]+=posedVerts[k+2]*w}return[x[0]+q.o[0]*S[0],x[1]+q.o[1]*S[1],x[2]+q.o[2]*S[2]]})}
async function readCloth(kind,id){const root=`${CLOTH}/${kind}/${id}`,[mt,ot]=await Promise.all([txt(`${root}/${id}.mhclo`),txt(`${root}/${id}.obj`)]);return{id,meta:mhclo(mt),mesh:obj(ot)}}
function clothMesh(data,color){const fv=fitVerts(data.meta),pos=[];for(const tri of data.mesh.f)for(const ix of tri){const p=fv[ix]||data.mesh.v[ix];if(p)pos.push(...p)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.7,side:THREE.DoubleSide,wireframe:wire}))}
function rebuildClothes(){for(const m of[top,bottom])if(m){scene.remove(m);m.geometry.dispose();m.material.dispose()}top=clothMesh(clothTopData,0xc97b9f);bottom=clothMesh(clothBottomData,0x7396c8);scene.add(top,bottom)}
function applyPose(){if(!body)return;skinBody(pose==='tpose'?tPose:null);body.geometry.attributes.position.array.set(posedVerts);body.geometry.attributes.position.needsUpdate=true;body.geometry.computeVertexNormals();rebuildClothes();ground();document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('active',b.dataset.pose===pose));msg((pose==='rest'?'Исходная hm08':'Официальная Anny T-pose')+'\nrig: game_engine · skin: official weights · clothing: MHCLO refit','ok')}
function fitCamera(){const h=Math.max(stage.clientHeight,1),fov=THREE.MathUtils.degToRad(cam.fov),d=bodyHeight*h/(2*TARGET_PX*Math.tan(fov/2));radius=Math.max(d,bodyHeight*.8);cam.position.set(0,bodyCenterY,radius);ctl.target.set(0,bodyCenterY,0);ctl.minDistance=radius*.45;ctl.maxDistance=radius*5;ctl.update()}
function ground(){for(const m of[body,top,bottom])if(m)m.position.set(0,0,0);const b=new THREE.Box3().setFromObject(body),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),off=new THREE.Vector3(-c.x,-b.min.y,-c.z);for(const m of[body,top,bottom])if(m)m.position.copy(off);bodyHeight=s.y;bodyCenterY=s.y*.5;fitCamera()}
function view(i){ctl.enableRotate=false;$('free').classList.remove('active');const a=Math.PI+i*Math.PI/4;cam.position.set(Math.sin(a)*radius,bodyCenterY,Math.cos(a)*radius);ctl.target.set(0,bodyCenterY,0);ctl.update()}function free(){ctl.enableRotate=true;$('free').classList.add('active')}
async function load(){msg('Загрузка hm08 + official rig + weights…');const [bt,r,w,p,ct,cb]=await Promise.all([txt(BASE),json(RIG),json(WEIGHTS),json(TPOSE),readCloth('top','joepal_plain_bra'),readCloth('bottom','elvs_bow_bottom_panty')]);const b=baseOBJ(bt);baseVerts=b.v;posedVerts=new Float32Array(baseVerts);faces=b.f;rig=r;weights=w;tPose=p;clothTopData=ct;clothBottomData=cb;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(posedVerts),3));g.setIndex(faces);g.computeVertexNormals();body=new THREE.Mesh(g,skin);scene.add(body);applyPose();free()}
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{pose=b.dataset.pose;applyPose()});$('free').onclick=free;$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);for(const m of[body,top,bottom])if(m)m.material.wireframe=wire};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(+b.dataset.v));function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight,false);cam.aspect=stage.clientWidth/stage.clientHeight;cam.updateProjectionMatrix();if(body)fitCamera()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{ctl.update();renderer.render(scene,cam)});load().catch(e=>{console.error(e);msg('ОШИБКА · '+e.message,'err')});
</script></body></html>
