<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1116">
<title>Game Live — Character Rig v1.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0f1116;color:#e9edf5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100vh}.wrap{max-width:820px;margin:auto;padding:18px 12px 44px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px}.top h1{font:700 30px/1 system-ui,sans-serif;margin:5px 0 0}small{color:#9298a7;font:14px system-ui,sans-serif}.ver{color:#9bd48f;text-align:right;font-size:14px;line-height:1.4}.stage,.panel{border:2px solid #343944;border-radius:24px;padding:14px;background:#171a21}.canvasWrap{display:flex;justify-content:center;background:#202530;border-radius:18px;overflow:hidden;margin-top:10px}canvas{width:min(100%,480px);height:auto;image-rendering:pixelated;display:block}.tag,.note{background:#0e1015;border-radius:14px;padding:9px 12px;color:#a5abb8;font-size:13px;line-height:1.45}.panel{margin-top:12px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}button,label{font:14px system-ui,sans-serif}button{border:1px solid #414856;background:#252a34;color:#eef2f7;border-radius:12px;padding:9px 12px}button.active{outline:2px solid #9bd48f}.err{color:#ff8f8f}.ok{color:#9bd48f}@media(max-width:600px){.top h1{font-size:25px}.ver{font-size:12px}.stage,.panel{border-radius:20px;padding:10px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><small>Game Live · graphics prototype</small><h1>Character Rig</h1></div><div class="ver">v1.0 · authored master<br>rig reconstruction test</div></div>
  <section class="stage">
    <div class="tag">female_average_front_v1 · source 126×400 · canvas 240×400</div>
    <div class="canvasWrap"><canvas id="c" width="240" height="400"></canvas></div>
  </section>
  <section class="panel">
    <div class="controls">
      <button id="master" class="active">Master 1:1</button>
      <button id="rig">Rig reconstruction</button>
      <label><input id="debug" type="checkbox"> debug regions</label>
    </div>
    <div id="status" class="note">Загружаю authored master…</div>
  </section>
</main>
<script type="module">
import {FEMALE_AVERAGE_FRONT_V1} from './character/data/femaleAverageFrontV1.js?v=1.0';
const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
const status=document.getElementById('status'),debug=document.getElementById('debug');
const bMaster=document.getElementById('master'),bRig=document.getElementById('rig');
let mode='master';
const img=new Image();
const ROOT_X=57,ROOT_Y=0; // 126px asset centered in 240px canvas
const regions=[
  {id:'head_base',sx:0,sy:0,sw:126,sh:100},
  {id:'body_core',sx:0,sy:80,sw:126,sh:165},
  {id:'legs_feet',sx:0,sy:225,sw:126,sh:175}
];
function bg(){ctx.clearRect(0,0,240,400);ctx.fillStyle='#202530';ctx.fillRect(0,0,240,304);ctx.fillStyle='#151922';ctx.fillRect(0,304,240,96)}
function drawMaster(){ctx.drawImage(img,ROOT_X,ROOT_Y)}
function drawRig(){for(const r of regions)ctx.drawImage(img,r.sx,r.sy,r.sw,r.sh,ROOT_X+r.sx,ROOT_Y+r.sy,r.sw,r.sh)}
function drawDebug(){ctx.save();ctx.font='10px monospace';ctx.lineWidth=1;for(const r of regions){ctx.strokeStyle='rgba(130,255,170,.8)';ctx.strokeRect(ROOT_X+r.sx+.5,ROOT_Y+r.sy+.5,r.sw-1,r.sh-1);ctx.fillStyle='rgba(130,255,170,.95)';ctx.fillText(r.id,ROOT_X+r.sx+3,ROOT_Y+r.sy+12)}ctx.restore()}
function render(){bg();if(!img.complete||!img.naturalWidth)return;mode==='master'?drawMaster():drawRig();if(debug.checked)drawDebug();status.innerHTML=mode==='master'?'<span class="ok">MASTER:</span> исходный художественный sprite выводится без процедурного рисования и без деформации.':'<span class="ok">RIG TEST:</span> тот же master собирается из перекрывающихся регионов. На этом этапе результат обязан совпадать с исходником.'}
img.onload=()=>{status.innerHTML='<span class="ok">OK:</span> authored master загружен. Переключи Master / Rig reconstruction.';render()};
img.onerror=e=>{console.error(e);status.innerHTML='<span class="err">Ошибка:</span> master sprite module загрузился, но браузер не декодировал data URL.'};
img.src=FEMALE_AVERAGE_FRONT_V1;
bMaster.onclick=()=>{mode='master';bMaster.classList.add('active');bRig.classList.remove('active');render()};
bRig.onclick=()=>{mode='rig';bRig.classList.add('active');bMaster.classList.remove('active');render()};
debug.onchange=render;
</script>
</body>
</html>
