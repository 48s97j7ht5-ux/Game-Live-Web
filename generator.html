<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1116">
<title>Game Live — Character Rig v1.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0f1116;color:#e9edf5;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100vh}.wrap{max-width:820px;margin:auto;padding:18px 12px 44px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px}.top h1{font:700 30px/1 system-ui,sans-serif;margin:5px 0 0}small{color:#9298a7;font:14px system-ui,sans-serif}.ver{color:#9bd48f;text-align:right;font-size:14px;line-height:1.4}.stage,.panel{border:2px solid #343944;border-radius:24px;padding:14px;background:#171a21}.canvasWrap{display:flex;justify-content:center;background:#202530;border-radius:18px;overflow:hidden;margin-top:10px}canvas{width:min(100%,480px);height:auto;image-rendering:pixelated;display:block}.tag,.note{background:#0e1015;border-radius:14px;padding:9px 12px;color:#a5abb8;font-size:13px;line-height:1.45}.panel{margin-top:12px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}button,label{font:14px system-ui,sans-serif}button{border:1px solid #414856;background:#252a34;color:#eef2f7;border-radius:12px;padding:9px 12px}button.active{outline:2px solid #9bd48f}.sliderRow{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;margin:12px 0 4px;padding:10px 12px;background:#0e1015;border-radius:14px}.sliderRow input{width:100%}.value{color:#9bd48f;text-align:right}.err{color:#ff8f8f}.ok{color:#9bd48f}@media(max-width:600px){.top h1{font-size:25px}.ver{font-size:12px}.stage,.panel{border-radius:20px;padding:10px}.sliderRow{grid-template-columns:86px 1fr 48px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><small>Game Live · graphics prototype</small><h1>Character Rig</h1></div><div class="ver">v1.1 · authored master<br>local chest deformation</div></div>
  <section class="stage">
    <div class="tag">female_average_front_v1 · source 126×400 · canvas 240×400</div>
    <div class="canvasWrap"><canvas id="c" width="240" height="400"></canvas></div>
  </section>
  <section class="panel">
    <div class="controls">
      <button id="master">Master 1:1</button>
      <button id="rig" class="active">Rig reconstruction</button>
      <label><input id="debug" type="checkbox"> debug regions</label>
    </div>
    <div class="sliderRow">
      <label for="breast">Грудь</label>
      <input id="breast" type="range" min="80" max="120" value="100" step="1">
      <div id="breastValue" class="value">100%</div>
    </div>
    <div id="status" class="note">Загружаю authored master…</div>
  </section>
</main>
<script type="module">
import {FEMALE_AVERAGE_FRONT_V1} from './character/data/femaleAverageFrontV1.js?v=1.0';

const c=document.getElementById('c'),ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
const status=document.getElementById('status');
const debug=document.getElementById('debug');
const bMaster=document.getElementById('master');
const bRig=document.getElementById('rig');
const breast=document.getElementById('breast');
const breastValue=document.getElementById('breastValue');

let mode='rig';
const img=new Image();
const ROOT_X=57,ROOT_Y=0;
const SRC_W=126,SRC_H=400;
const regions=[
  {id:'head_base',sx:0,sy:0,sw:126,sh:100},
  {id:'body_core',sx:0,sy:80,sw:126,sh:165},
  {id:'legs_feet',sx:0,sy:225,sw:126,sh:175}
];

const source=document.createElement('canvas');
source.width=SRC_W;source.height=SRC_H;
const sctx=source.getContext('2d',{willReadFrequently:true});
sctx.imageSmoothingEnabled=false;

const warped=document.createElement('canvas');
warped.width=SRC_W;warped.height=SRC_H;
const wctx=warped.getContext('2d',{willReadFrequently:true});
wctx.imageSmoothingEnabled=false;

function bg(){
  ctx.clearRect(0,0,240,400);
  ctx.fillStyle='#202530';ctx.fillRect(0,0,240,304);
  ctx.fillStyle='#151922';ctx.fillRect(0,304,240,96);
}

function copyPixel(src, dst, sx, sy, dx, dy, w){
  const si=(sy*w+sx)*4, di=(dy*w+dx)*4;
  dst[di]=src[si];dst[di+1]=src[si+1];dst[di+2]=src[si+2];dst[di+3]=src[si+3];
}

function deformChest(size){
  wctx.clearRect(0,0,SRC_W,SRC_H);
  if(size===100){wctx.drawImage(source,0,0);return;}

  const src=sctx.getImageData(0,0,SRC_W,SRC_H);
  const out=new ImageData(SRC_W,SRC_H);
  out.data.set(src.data);

  const t=(size-100)/20;
  const cx=SRC_W/2;
  const yTop=92,yBottom=165;
  const leftApex={x:47,y:124};
  const rightApex={x:79,y:124};
  const rx=28,ry=34;

  for(let y=yTop;y<=yBottom;y++){
    for(let x=18;x<=108;x++){
      const isLeft=x<cx;
      const apex=isLeft?leftApex:rightApex;
      const nx=(x-apex.x)/rx;
      const ny=(y-apex.y)/ry;
      const d=nx*nx+ny*ny;
      if(d>=1) continue;

      const fall=(1-d)*(1-d);
      const side=isLeft?-1:1;
      const lower=Math.max(0,Math.min(1,(y-yTop)/(yBottom-yTop)));
      const pushX=side*(3.8*t*fall);
      const pushY=(1.3*t*fall)+(0.9*t*fall*lower);

      const sx=Math.max(0,Math.min(SRC_W-1,Math.round(x-pushX)));
      const sy=Math.max(0,Math.min(SRC_H-1,Math.round(y-pushY)));
      copyPixel(src.data,out.data,sx,sy,x,y,SRC_W);
    }
  }
  wctx.putImageData(out,0,0);
}

function drawMaster(){ctx.drawImage(source,ROOT_X,ROOT_Y)}

function drawRig(){
  deformChest(Number(breast.value));
  for(const r of regions){
    ctx.drawImage(warped,r.sx,r.sy,r.sw,r.sh,ROOT_X+r.sx,ROOT_Y+r.sy,r.sw,r.sh);
  }
}

function drawDebug(){
  ctx.save();ctx.font='10px monospace';ctx.lineWidth=1;
  for(const r of regions){
    ctx.strokeStyle='rgba(130,255,170,.8)';
    ctx.strokeRect(ROOT_X+r.sx+.5,ROOT_Y+r.sy+.5,r.sw-1,r.sh-1);
    ctx.fillStyle='rgba(130,255,170,.95)';
    ctx.fillText(r.id,ROOT_X+r.sx+3,ROOT_Y+r.sy+12);
  }
  ctx.strokeStyle='rgba(255,190,90,.9)';
  ctx.strokeRect(ROOT_X+18.5,ROOT_Y+92.5,90,73);
  ctx.fillStyle='rgba(255,190,90,.95)';
  ctx.fillText('chest warp',ROOT_X+21,ROOT_Y+104);
  ctx.restore();
}

function render(){
  bg();
  if(!img.complete||!img.naturalWidth)return;
  if(mode==='master') drawMaster(); else drawRig();
  if(debug.checked) drawDebug();
  const value=Number(breast.value);
  breastValue.textContent=value+'%';
  if(mode==='master'){
    status.innerHTML='<span class="ok">MASTER:</span> исходный sprite без деформации. Ползунок специально не влияет на этот режим.';
  }else{
    status.innerHTML='<span class="ok">RIG TEST:</span> локальная деформация грудной зоны · '+value+'%. 100% = исходная форма.';
  }
}

img.onload=()=>{
  sctx.clearRect(0,0,SRC_W,SRC_H);
  sctx.drawImage(img,0,0,SRC_W,SRC_H);
  wctx.drawImage(source,0,0);
  status.innerHTML='<span class="ok">OK:</span> authored master загружен.';
  render();
};
img.onerror=e=>{
  console.error(e);
  status.innerHTML='<span class="err">Ошибка:</span> браузер не декодировал master sprite.';
};
img.src=FEMALE_AVERAGE_FRONT_V1;

bMaster.onclick=()=>{mode='master';bMaster.classList.add('active');bRig.classList.remove('active');render()};
bRig.onclick=()=>{mode='rig';bRig.classList.add('active');bMaster.classList.remove('active');render()};
debug.onchange=render;
breast.oninput=render;
</script>
</body>
</html>
