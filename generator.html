<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Live — Character Generator</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101114;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));background:#101114}main{width:min(100%,760px);margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.top h1{font-size:20px;margin:0}.top small{color:#8e939b}.app{display:grid;grid-template-columns:minmax(230px,1fr) minmax(210px,280px);gap:12px}.stage,.panel{background:#181a1f;border:1px solid #30333a;border-radius:16px}.stage{min-height:520px;display:grid;place-items:center;overflow:hidden;position:relative;background:linear-gradient(#20232a 0 72%,#191b20 72%)}canvas{width:auto;height:min(72svh,500px);max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges}.tag{position:absolute;left:12px;top:12px;font-size:11px;color:#9ba1aa;background:#111318cc;padding:6px 8px;border-radius:8px}.panel{padding:14px}.row{margin:0 0 12px}.row label{display:flex;justify-content:space-between;font-size:12px;color:#c9cdd3;margin-bottom:5px}.row output{color:#fff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#d9d9df}select,button{width:100%;border:1px solid #3b3f48;border-radius:10px;background:#22252b;color:#fff;padding:10px;font:inherit}button{font-weight:700;margin-top:5px;background:#ececf0;color:#111;border:0}.note{font-size:11px;line-height:1.4;color:#8e939b;margin-top:10px}@media(max-width:600px){.app{grid-template-columns:1fr}.stage{min-height:480px}canvas{height:450px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.panel .wide,.panel button,.panel .note{grid-column:1/-1}}
</style>
</head>
<body><main>
<div class="top"><div><small>Game Live · graphics prototype</small><h1>Генератор тела v0.1</h1></div><small>400 px</small></div>
<div class="app"><section class="stage"><div class="tag">neutral_front · body geometry</div><canvas id="c" width="240" height="400"></canvas></section>
<section class="panel">
<div class="row wide"><label>Тип тела</label><select id="sex"><option value="f">Женский</option><option value="m">Мужской</option></select></div>
<div class="row"><label>Рост <output id="heightO"></output></label><input id="height" type="range" min="150" max="200" value="170"></div>
<div class="row"><label>Масса <output id="weightO"></output></label><input id="weight" type="range" min="45" max="110" value="62"></div>
<div class="row"><label>Плечи <output id="shouldersO"></output></label><input id="shoulders" type="range" min="70" max="130" value="96"></div>
<div class="row"><label>Талия <output id="waistO"></output></label><input id="waist" type="range" min="70" max="135" value="92"></div>
<div class="row"><label>Бёдра <output id="hipsO"></output></label><input id="hips" type="range" min="70" max="140" value="108"></div>
<div class="row"><label>Мышцы <output id="muscleO"></output></label><input id="muscle" type="range" min="0" max="100" value="20"></div>
<div class="row"><label>Грудь <output id="chestO"></output></label><input id="chest" type="range" min="0" max="100" value="45"></div>
<div class="row"><label>Тон кожи <output id="skinO"></output></label><input id="skin" type="range" min="0" max="100" value="42"></div>
<button id="random">Случайный NPC</button><div class="note">Первый тест строит только параметрический силуэт. Одежда, волосы, лицо и детали тела будут отдельными слоями.</div>
</section></div></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const ids=['height','weight','shoulders','waist','hips','muscle','chest','skin'];const el=Object.fromEntries(ids.map(i=>[i,document.getElementById(i)]));el.sex=document.getElementById('sex');
function val(id){return +el[id].value}function lerp(a,b,t){return a+(b-a)*t}function skinColor(v){let t=v/100;let a=[246,210,181],b=[105,65,48];return `rgb(${a.map((n,i)=>Math.round(lerp(n,b[i],t))).join(',')})`}
function poly(points,fill,stroke='#2a2020'){x.beginPath();x.moveTo(...points[0]);for(let i=1;i<points.length;i++)x.lineTo(...points[i]);x.closePath();x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}
function ellipse(cx,cy,rx,ry,fill){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.fillStyle=fill;x.fill();x.strokeStyle='#2a2020';x.lineWidth=2;x.stroke()}
function render(){x.clearRect(0,0,c.width,c.height);let sex=el.sex.value,H=val('height'),W=val('weight'),fat=(W-45)/65,mus=val('muscle')/100,sh=val('shoulders')/100,wa=val('waist')/100,hi=val('hips')/100,ch=val('chest')/100;let scale=H/170,skin=skinColor(val('skin'));let top=18+(1-scale)*18,bottom=382,bodyH=bottom-top,headH=52*scale,neckY=top+headH,shouldY=neckY+25,waistY=top+bodyH*.48,hipY=top+bodyH*.59,kneeY=top+bodyH*.80;let cx=120;let shoulder=sex==='m'?44:38;shoulder*=sh;shoulder+=mus*8+fat*4;let waist=(sex==='m'?31:27)*wa+fat*12;let hips=(sex==='m'?34:39)*hi+fat*10;let calf=13+mus*3+fat*2;let arm=10+mus*4+fat*3;ellipse(cx,top+headH*.45,21+fat*2,headH*.45,skin);poly([[cx-8,neckY-5],[cx+8,neckY-5],[cx+10,shouldY],[cx-10,shouldY]],skin);poly([[cx-shoulder,shouldY],[cx-25-(sex==='m'?ch*5:ch*2),top+bodyH*.34],[cx-waist,waistY],[cx-hips,hipY],[cx+hips,hipY],[cx+waist,waistY],[cx+25+(sex==='m'?ch*5:ch*2),top+bodyH*.34],[cx+shoulder,shouldY]],skin);if(sex==='f'&&ch>.05){ellipse(cx-14,top+bodyH*.34,8+ch*8,6+ch*5,skin);ellipse(cx+14,top+bodyH*.34,8+ch*8,6+ch*5,skin)}poly([[cx-shoulder+2,shouldY+5],[cx-shoulder-arm,shouldY+10],[cx-hips-10,hipY-5],[cx-hips+2,hipY],[cx-waist-2,waistY]],skin);poly([[cx+shoulder-2,shouldY+5],[cx+shoulder+arm,shouldY+10],[cx+hips+10,hipY-5],[cx+hips-2,hipY],[cx+waist+2,waistY]],skin);poly([[cx-hips+3,hipY-2],[cx-4,hipY],[cx-7,kneeY],[cx-7-calf,bottom-15],[cx-25,bottom-5],[cx-7,bottom],[cx+1,kneeY]],skin);poly([[cx+hips-3,hipY-2],[cx+4,hipY],[cx+7,kneeY],[cx+7+calf,bottom-15],[cx+25,bottom-5],[cx+7,bottom],[cx-1,kneeY]],skin);x.fillStyle='#241d1d';x.fillRect(cx-14,top+headH*.42,4,3);x.fillRect(cx+10,top+headH*.42,4,3);x.fillRect(cx-5,top+headH*.67,10,2);ids.forEach(id=>document.getElementById(id+'O').textContent=id==='height'?val(id)+' см':id==='weight'?val(id)+' кг':val(id)+'%')}
ids.forEach(i=>el[i].addEventListener('input',render));el.sex.addEventListener('change',render);document.getElementById('random').onclick=()=>{el.sex.value=Math.random()<.5?'f':'m';el.height.value=155+Math.floor(Math.random()*41);el.weight.value=48+Math.floor(Math.random()*53);['shoulders','waist','hips'].forEach(i=>el[i].value=78+Math.floor(Math.random()*45));el.muscle.value=Math.floor(Math.random()*70);el.chest.value=Math.floor(Math.random()*85);el.skin.value=Math.floor(Math.random()*90);render()};render();
</script></body></html>
