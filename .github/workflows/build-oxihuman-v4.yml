name: Build OxiHuman v4 assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oxihuman-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OxiHuman
        uses: actions/checkout@v4
        with:
          repository: cool-japan/oxihuman
          ref: master
          path: _oxihuman

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build OxiHuman BodyLab payload
        working-directory: _oxihuman
        run: scripts/build_demo.sh

      - name: Copy browser assets into game repo
        run: |
          rm -rf experiments/oxihuman-v4
          mkdir -p experiments/oxihuman-v4/pkg experiments/oxihuman-v4/pack
          cp _oxihuman/demo/pkg/oxihuman_wasm.js experiments/oxihuman-v4/pkg/
          cp _oxihuman/demo/pkg/oxihuman_wasm_bg.wasm experiments/oxihuman-v4/pkg/
          cp _oxihuman/demo/pack/oxihuman-core-v1.ohpk experiments/oxihuman-v4/pack/
          cp _oxihuman/LICENSE experiments/oxihuman-v4/OXIHUMAN_LICENSE
          printf 'Built from cool-japan/oxihuman master by GitHub Actions.\n' > experiments/oxihuman-v4/README.txt

      - name: Commit built assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/oxihuman-v4
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Build OxiHuman v4 browser assets'
            git push origin main
          fi
