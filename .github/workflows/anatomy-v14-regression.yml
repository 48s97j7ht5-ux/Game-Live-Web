name: Anatomy v1.4 regression
on:
  workflow_dispatch:
  push:
    branches: ['dev/skeleton-v1.4']
    paths:
      - 'character/skeleton-mechanics-v*.js'
      - 'character/anatomy-regression-v14.*'
      - 'tests/anatomy-v14-screenshots.mjs'
      - 'tools/build-skeleton-v14.mjs'
      - '.github/workflows/anatomy-v14-regression.yml'
permissions:
  contents: write
concurrency:
  group: anatomy-v14-regression
  cancel-in-progress: true
jobs:
  anatomy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/skeleton-v1.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Generate standalone Skeleton v1.4
        run: node tools/build-skeleton-v14.mjs
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/anatomy-v14-http.log 2>&1 &
          sleep 3
      - name: Capture anatomy matrix
        run: node tests/anatomy-v14-screenshots.mjs
      - name: Commit generated v1.4 and regression output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character/skeleton-v14.js anatomy-test-output/v14-anatomy
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: update Skeleton v1.4 anatomy regression"
          git push origin HEAD:dev/skeleton-v1.4
      - uses: actions/upload-artifact@v4
        with:
          name: anatomy-v14-regression
          path: anatomy-test-output/v14-anatomy
          retention-days: 14
