name: Anatomy v1.6 mechanics regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'character/skeleton-v16.js'
      - 'character/skeleton-mechanics-v21.js'
      - 'character/skeleton-mechanics-v22.js'
      - 'character/skeleton-mechanics-v23.js'
      - 'character/character-body-volume-v1.js'
      - 'character/character-muscle-volume-v1.js'
      - 'character/character-body-surface-v1.js'
      - 'character/character-contour-v1.js'
      - 'character/skeleton-v16-mechanics-preview.*'
      - 'character/skeleton-mechanics-v16.js'
      - 'character/skeleton-mechanics-v19.js'
      - 'character/skeleton-mechanics-v20.js'
      - 'character/anatomy-regression-test.*'
      - 'tests/anatomy-screenshots.mjs'
      - '.github/workflows/anatomy-regression.yml'
permissions:
  contents: write
concurrency:
  group: anatomy-regression
  cancel-in-progress: true
jobs:
  screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        run: sleep 45
      - name: Capture anatomy poses
        run: npm run test:anatomy
      - name: Commit latest anatomy report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anatomy-test-output/latest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: update anatomy regression screenshots"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: anatomy-regression-latest
          path: anatomy-test-output/latest
          retention-days: 14
