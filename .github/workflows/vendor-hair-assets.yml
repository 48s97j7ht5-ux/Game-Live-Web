name: Vendor MakeHuman hair assets

on:
  push:
    paths:
      - '.github/workflows/vendor-hair-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-hair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real CC0 MakeHuman hair assets with Git LFS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/Humentity
          git lfs install
          git clone --depth 1 https://github.com/emberlightstudios/Humentity.git /tmp/Humentity
          cd /tmp/Humentity
          git lfs pull
          cd "$GITHUB_WORKSPACE"

          SRC='/tmp/Humentity/assets/body_parts/Hair'
          mkdir -p engine/hair
          for id in bob01 long01 ponytail01 short02 braid01; do
            dst="engine/hair/$id"
            rm -rf "$dst"
            mkdir -p "$dst"
            cp "$SRC/$id/$id.mhclo" "$dst/$id.mhclo"
            cp "$SRC/$id/$id.obj"   "$dst/$id.obj"
            for file in "$id.mhmat" "${id}_diffuse.png" "$id.thumb"; do
              [ -f "$SRC/$id/$file" ] && cp "$SRC/$id/$file" "$dst/$file" || true
            done

            if head -n 1 "$dst/$id.obj" | grep -q 'git-lfs.github.com/spec'; then
              echo "ERROR: $id.obj is still an LFS pointer" >&2
              exit 1
            fi
            grep -q '^f ' "$dst/$id.obj" || { echo "ERROR: $id.obj has no faces" >&2; exit 1; }
          done

          cat > engine/hair/README.md <<'EOF'
          # MakeHuman hair assets

          Vendored from `emberlightstudios/Humentity`, which contains the MakeHuman system assets released as CC0.
          Binary/LFS-backed OBJ files are resolved through Git LFS before copying, so the browser receives real mesh data rather than LFS pointer text.

          Included:
          - bob01
          - long01
          - ponytail01
          - short02
          - braid01
          EOF

      - name: Ensure experiment uses local assets and global hair offset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('engine/hair-mesh-experiment.html')
          s = p.read_text(encoding='utf-8')
          for old in [
              "const ROOT='https://free.downloads.tuxfamily.net/makehuman/assets/1.1/base/hair';",
              "const ASSET_ROOT='https://free.downloads.tuxfamily.net/makehuman/assets/1.1/base/hair';",
              "const ASSET_ROOT='https://raw.githubusercontent.com/makehumancommunity/makehuman-assets/master/base/hair';",
          ]:
              s = s.replace(old, "const ROOT='./hair';")
          s = s.replace("const HAIR_Y_OFFSET=0.035;", "const HAIR_Y_OFFSET=0.070;")
          s = s.replace("hair Y +0.035", "hair Y +0.070")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit vendored assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/hair engine/hair-mesh-experiment.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Raise global hair Y offset to 0.070'
            git push
          fi
