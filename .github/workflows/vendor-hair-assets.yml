name: Vendor MakeHuman hair assets

on:
  push:
    paths:
      - '.github/workflows/vendor-hair-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-hair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CC0 MakeHuman hair assets
        shell: bash
        run: |
          set -euo pipefail
          SRC='https://raw.githubusercontent.com/emberlightstudios/Humentity/252b501ffb819e8a4f6bc97b9269c59479e8be55/assets/body_parts/Hair'
          mkdir -p engine/hair

          for id in bob01 long01 ponytail01 short02 braid01; do
            dst="engine/hair/$id"
            mkdir -p "$dst"

            curl -fL --retry 3 "$SRC/$id/$id.mhclo" -o "$dst/$id.mhclo"
            curl -fL --retry 3 "$SRC/$id/$id.obj"   -o "$dst/$id.obj"

            for file in "$id.mhmat" "${id}_diffuse.png" "$id.thumb"; do
              curl -fL --retry 2 "$SRC/$id/$file" -o "$dst/$file" || rm -f "$dst/$file"
            done
          done

          cat > engine/hair/README.md <<'EOF'
          # MakeHuman hair assets

          Vendored from `emberlightstudios/Humentity`, which contains MakeHuman system assets released as CC0.

          Included:
          - bob01
          - long01
          - ponytail01
          - short02
          - braid01

          Runtime loads these assets locally from `engine/hair/`; there is no TuxFamily/CORS dependency.
          EOF

      - name: Point hair experiment at local assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('engine/hair-mesh-experiment.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              "const ROOT='https://free.downloads.tuxfamily.net/makehuman/assets/1.1/base/hair';",
              "const ROOT='https://raw.githubusercontent.com/makehumancommunity/makehuman-assets/master/base/hair';",
              "const ASSET_ROOT='https://free.downloads.tuxfamily.net/makehuman/assets/1.1/base/hair';",
              "const ASSET_ROOT='https://raw.githubusercontent.com/makehumancommunity/makehuman-assets/master/base/hair';",
          ]
          done = False
          for old in replacements:
              if old in s:
                  key = 'ASSET_ROOT' if 'ASSET_ROOT' in old else 'ROOT'
                  s = s.replace(old, f"const {key}='./hair';")
                  done = True
          if not done and "='./hair';" not in s:
              raise SystemExit('hair root pattern not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit vendored assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/hair engine/hair-mesh-experiment.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Vendor MakeHuman hair assets locally'
            git push
          fi
