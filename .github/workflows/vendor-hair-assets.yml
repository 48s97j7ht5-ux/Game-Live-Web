name: Vendor MakeHuman hair assets

on:
  push:
    paths:
      - '.github/workflows/vendor-hair-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-hair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CC0 MakeHuman hair assets
        shell: bash
        run: |
          set -euo pipefail
          SRC='https://raw.githubusercontent.com/emberlightstudios/Humentity/252b501ffb819e8a4f6bc97b9269c59479e8be55/assets/body_parts/Hair'
          mkdir -p engine/hair

          for id in bob01 long01 ponytail01 short02 braid01; do
            dst="engine/hair/$id"
            mkdir -p "$dst"
            curl -fL --retry 3 "$SRC/$id/$id.mhclo" -o "$dst/$id.mhclo"
            curl -fL --retry 3 "$SRC/$id/$id.obj"   -o "$dst/$id.obj"
            for file in "$id.mhmat" "${id}_diffuse.png" "$id.thumb"; do
              curl -fL --retry 2 "$SRC/$id/$file" -o "$dst/$file" || rm -f "$dst/$file"
            done
          done

          cat > engine/hair/README.md <<'EOF'
          # MakeHuman hair assets

          Vendored from `emberlightstudios/Humentity`, which contains the MakeHuman system assets released as CC0.

          Included for the browser hair experiment:
          - bob01
          - long01
          - ponytail01
          - short02
          - braid01

          Runtime code loads these files locally from `engine/hair/`.
          EOF

      - name: Point hair experiment at local assets and fix MHCLO state parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('engine/hair-mesh-experiment.html')
          s = p.read_text(encoding='utf-8')
          for old in [
              "const ROOT='https://free.downloads.tuxfamily.net/makehuman/assets/1.1/base/hair';",
              "const ASSET_ROOT='https://free.downloads.tuxfamily.net/makehuman/assets/1.1/base/hair';",
              "const ASSET_ROOT='https://raw.githubusercontent.com/makehumancommunity/makehuman-assets/master/base/hair';",
          ]:
              s = s.replace(old, "const ROOT='./hair';")

          # Official MakeHuman proxy.py keeps status=doRefVerts after the `verts`
          # keyword even when recognized metadata (such as `material`) occurs.
          # Our first JS parser incorrectly cleared the mode at `material`, so every
          # subsequent numeric mapping line was skipped and MHCLO reported 0 mappings.
          s = s.replace("if(mode)mode=false;", "")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit vendored assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/hair engine/hair-mesh-experiment.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix MakeHuman MHCLO mapping parser'
            git push
          fi
