name: Build Skeleton v1.4
on:
  workflow_dispatch:
  push:
    branches: ['dev/skeleton-v1.4']
    paths:
      - 'tools/build-skeleton-v14.mjs'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/skeleton-v1.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-skeleton-v14.mjs
      - name: Commit generated standalone v1.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character/skeleton-v14.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: generate standalone Skeleton v1.4"
          git push origin HEAD:dev/skeleton-v1.4
