<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Game Live — тест</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #f5f5f5; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); background: #1b1b1b; border: 1px solid #333; border-radius: 20px; padding: 24px; box-shadow: 0 16px 50px rgba(0,0,0,.35); }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { line-height: 1.5; color: #cfcfcf; }
    button { width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 15px 18px; font-size: 17px; font-weight: 700; background: #f5f5f5; color: #111; }
    #status { margin-top: 16px; min-height: 24px; font-weight: 700; }
    .ok { color: #71e38b; }
  </style>
</head>
<body>
  <main>
    <h1>Game Live 👋</h1>
    <p>Тестовая страница загружена из публичного репозитория GitHub Pages.</p>
    <p>Если эта страница открылась на телефоне, значит HTML и CSS уже работают.</p>
    <button id="testButton" type="button">Проверить JavaScript</button>
    <div id="status"></div>
  </main>

  <script>
    document.getElementById('testButton').addEventListener('click', () => {
      const status = document.getElementById('status');
      status.textContent = 'JavaScript работает ✓';
      status.className = 'ok';
    });
  </script>
</body>
</html>
