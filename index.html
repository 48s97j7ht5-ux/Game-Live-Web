<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d11"><title>Game Live</title>
<style>
:root{--bg:#0d1015;--panel:#151920;--line:#29303a;--text:#f4f5f7;--muted:#929cab;--accent:#d8ff62}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#080a0e;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit}.app{width:min(100%,430px);height:100dvh;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);overflow:hidden}.top{padding:calc(7px + env(safe-area-inset-top)) 12px 7px;border-bottom:1px solid var(--line);background:#0d1015}.top-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.date strong,.cash strong{display:block;font-size:12px}.date span,.cash span{font-size:10px;color:var(--muted)}.cash{text-align:right}.clock{font-size:20px;font-weight:850;letter-spacing:.5px}.sub{margin-top:5px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px}.speed{display:flex;gap:4px}.speed button{width:27px;height:25px;padding:0;border:1px solid var(--line);border-radius:7px;background:#171b22}.speed button.active{background:var(--accent);border-color:var(--accent);color:#111;font-weight:800}.world{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}.scene{position:relative;min-height:0;overflow:hidden;background:linear-gradient(#596572 0 42%,#69705c 42% 47%,#353a31 47%)}.sun{position:absolute;right:-40px;top:-65px;width:180px;height:180px;border-radius:50%;background:rgba(255,225,145,.2);filter:blur(12px)}.building{position:absolute;left:7%;right:7%;bottom:14%;height:57%;background:#847c6e;border:3px solid #403d38;box-shadow:0 16px 28px #0005}.building:before{content:"";position:absolute;inset:8%;background:repeating-linear-gradient(to right,transparent 0 15%,#363a3b 15% 23%,transparent 23% 32%),repeating-linear-gradient(to bottom,transparent 0 13%,#b7aa7c 13% 21%,transparent 21% 29%)}.door{position:absolute;left:42%;bottom:0;width:16%;height:34%;background:#25292a;border:3px solid #4b4945}.tree{position:absolute;left:4%;bottom:5%;width:25px;height:170px;background:#503b2b;border-radius:10px}.tree:before{content:"";position:absolute;width:135px;height:135px;left:-52px;top:-55px;border-radius:50%;background:#394a36;box-shadow:38px 16px #33452f,-31px 25px #40523b}.place,.hint{position:absolute;background:#0b0e12c9;border:1px solid #ffffff18;backdrop-filter:blur(8px)}.place{top:12px;left:12px;padding:7px 9px;border-radius:8px;font-size:11px;font-weight:750}.hint{right:12px;bottom:12px;padding:6px 8px;border-radius:7px;font-size:9px;color:#e2e6eb}.story{padding:11px 12px 12px;background:var(--panel);border-top:1px solid var(--line)}.title{display:flex;justify-content:space-between;align-items:center;gap:8px}.title h1{font-size:16px;margin:0}.title span{font-size:9px;color:var(--muted)}.story p{margin:7px 0 0;color:#d2d7df;font-size:12px;line-height:1.4;min-height:34px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.actions button{min-height:39px;border:1px solid var(--line);border-radius:10px;background:#1c2129;font-size:12px;font-weight:750}.actions .primary{background:var(--accent);border-color:var(--accent);color:#10130b}.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#0f1217;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;padding:7px 2px 6px;color:var(--muted)}.nav button.active{color:var(--accent)}.nav .ico{display:block;font-size:17px;line-height:19px}.nav .label{display:block;font-size:9px;font-weight:750;margin-top:2px}.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#f2f4f6;color:#15181c;padding:9px 12px;border-radius:10px;font-size:11px;font-weight:700;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){body{display:grid;place-items:center}.app{height:min(900px,100dvh);border:1px solid #181d25}}
</style>
</head><body><main class="app">
<header class="top"><div class="top-main"><div class="date"><strong>Понедельник</strong><span>1 сентября</span></div><div class="clock" id="clock">08:10</div><div class="cash"><strong>24 500 ₽</strong><span>деньги</span></div></div><div class="sub"><span>☁ +18° · прохладно</span><div class="speed"><button data-speed="0">Ⅱ</button><button class="active" data-speed="1">▶</button><button data-speed="4">▶▶</button></div></div></header>
<section class="world"><div class="scene"><div class="sun"></div><div class="building"><div class="door"></div></div><div class="tree"></div><div class="place">ДВОР · ДОМ 17</div><div class="hint">08:10 · тихое утро</div></div><div class="story"><div class="title"><h1 id="title">Твой новый дом</h1><span id="meta">Двор</span></div><p id="text">Ты стоишь во дворе старой пятиэтажки. Вещи уже занесены в квартиру. Дом живёт своей обычной утренней жизнью.</p><div class="actions"><button class="primary" id="look">Осмотреться</button><button id="enter">Зайти в подъезд</button></div></div></section>
<nav class="nav"><button class="active" data-tab="world"><span class="ico">⌂</span><span class="label">Мир</span></button><button data-tab="phone"><span class="ico">▣</span><span class="label">Телефон</span></button><button data-tab="map"><span class="ico">◇</span><span class="label">Карта</span></button><button data-tab="me"><span class="ico">●</span><span class="label">Я</span></button></nav></main><div class="toast" id="toast"></div>
<script>
let minutes=490,speed=1,timer;const clock=document.querySelector('#clock'),text=document.querySelector('#text'),title=document.querySelector('#title'),meta=document.querySelector('#meta'),toast=document.querySelector('#toast');function render(){let h=Math.floor(minutes/60)%24,m=minutes%60;clock.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}function run(){clearInterval(timer);if(!speed)return;timer=setInterval(()=>{minutes=(minutes+speed)%1440;render()},1500)}function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1300)}document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('active'));b.classList.add('active');speed=+b.dataset.speed;run();say(speed?speed===1?'Обычная скорость':'Время ускорено':'Пауза')});const screens={world:['Твой новый дом','Двор','Ты стоишь во дворе старой пятиэтажки. Вещи уже занесены в квартиру. Дом живёт своей обычной утренней жизнью.'],phone:['Телефон','Нет уведомлений','Здесь появятся сообщения, звонки, контакты и приложения.'],map:['Карта района','Знакомые места: 1','Пока тебе знакомы только дом и ближайший двор.'],me:['Персонаж','Состояние: нормально','Здесь будут состояние персонажа, одежда, потребности и личные параметры.']};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');let s=screens[b.dataset.tab];title.textContent=s[0];meta.textContent=s[1];text.textContent=s[2]});document.querySelector('#look').onclick=()=>{text.textContent='У подъезда пусто. В нескольких окнах горит свет, где-то наверху хлопнула дверь.';minutes+=1;render()};document.querySelector('#enter').onclick=()=>{text.textContent='Ты заходишь в подъезд. Пахнет прохладным бетоном и утренним кофе из одной из квартир.';meta.textContent='Подъезд';minutes+=2;render();say('Локация изменена')};render();run();
</script></body></html>
