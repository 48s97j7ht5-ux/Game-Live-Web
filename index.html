<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Game Live</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a20;
      --panel-2: #1d2129;
      --line: #2a303a;
      --text: #f2f4f7;
      --muted: #9aa3b2;
      --accent: #d9ff70;
      --danger: #ff7d7d;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: #090b0f; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button { font: inherit; color: inherit; }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.07), transparent 34%),
        #090b0f;
    }

    .app {
      width: min(100%, 430px);
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      background: var(--bg);
      border-left: 1px solid #151922;
      border-right: 1px solid #151922;
      overflow: hidden;
    }

    .topbar {
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: rgba(15,17,21,.96);
      border-bottom: 1px solid var(--line);
    }

    .topline {
      display: grid;
      grid-template-columns: 1.4fr .9fr .8fr;
      gap: 8px;
      align-items: center;
    }

    .daybox strong, .money strong { display: block; font-size: 14px; }
    .daybox span, .money span { color: var(--muted); font-size: 11px; }

    .clock {
      text-align: center;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .money { text-align: right; }

    .weather {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .speed {
      display: flex;
      gap: 5px;
    }

    .speed button {
      width: 30px;
      height: 28px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      cursor: pointer;
    }

    .speed button.active {
      background: var(--accent);
      color: #10130a;
      border-color: var(--accent);
      font-weight: 800;
    }

    .scene {
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #11151b;
      overflow: hidden;
    }

    .scene-art {
      position: relative;
      flex: 1;
      min-height: 330px;
      overflow: hidden;
      background:
        linear-gradient(to bottom, #56616c 0 42%, #59624e 42% 47%, #3c4036 47% 100%);
    }

    .sky-glow {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: rgba(255,226,150,.23);
      filter: blur(10px);
      top: -65px;
      right: -35px;
    }

    .building {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 22%;
      height: 50%;
      background: #80786a;
      border: 3px solid #3e3b36;
      box-shadow: 0 18px 25px rgba(0,0,0,.25);
    }

    .building::before {
      content: "";
      position: absolute;
      left: 7%; right: 7%; top: 10%; bottom: 10%;
      background:
        repeating-linear-gradient(to right, transparent 0 16%, #373b3c 16% 24%, transparent 24% 33%),
        repeating-linear-gradient(to bottom, transparent 0 13%, #b3a77d 13% 22%, transparent 22% 29%);
      opacity: .85;
    }

    .entrance {
      position: absolute;
      width: 17%;
      height: 36%;
      left: 41.5%;
      bottom: 0;
      background: #262a2b;
      border: 3px solid #4d4b46;
    }

    .tree {
      position: absolute;
      bottom: 10%;
      left: 4%;
      width: 24px;
      height: 150px;
      background: #4c3a2b;
      border-radius: 10px;
      transform: rotate(-2deg);
    }

    .tree::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 46% 54% 50% 50%;
      background: #394735;
      left: -48px;
      top: -48px;
      box-shadow: 35px 18px 0 #344330, -28px 22px 0 #40503b;
    }

    .scene-label {
      position: absolute;
      left: 14px;
      top: 14px;
      padding: 8px 10px;
      background: rgba(12,14,18,.78);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 11px;
      backdrop-filter: blur(10px);
      font-size: 12px;
      font-weight: 700;
    }

    .scene-hint {
      position: absolute;
      right: 14px;
      bottom: 14px;
      color: #e9edf1;
      font-size: 11px;
      background: rgba(12,14,18,.72);
      padding: 7px 9px;
      border-radius: 9px;
    }

    .story {
      background: linear-gradient(to bottom, rgba(23,26,32,.98), var(--panel));
      border-top: 1px solid var(--line);
      padding: 14px;
    }

    .location-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .location-title h1 { margin: 0; font-size: 18px; }
    .location-title span { color: var(--muted); font-size: 11px; }

    .event-text {
      margin: 0;
      min-height: 44px;
      line-height: 1.45;
      color: #d6dbe3;
      font-size: 14px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .actions button {
      min-height: 43px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      font-weight: 700;
      cursor: pointer;
    }

    .actions button.primary {
      background: var(--accent);
      color: #11150b;
      border-color: var(--accent);
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: #111419;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav button {
      border: 0;
      background: transparent;
      padding: 10px 4px 8px;
      color: var(--muted);
      cursor: pointer;
    }

    .nav button.active { color: var(--accent); }
    .nav .icon { display: block; font-size: 20px; line-height: 22px; }
    .nav .label { display: block; margin-top: 3px; font-size: 10px; font-weight: 700; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(88px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      width: min(calc(100% - 40px), 390px);
      background: #eef2f5;
      color: #16191d;
      border-radius: 12px;
      padding: 11px 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 700px) {
      body { padding: 20px 0; }
      .app { min-height: calc(100dvh - 40px); border-radius: 24px; box-shadow: 0 25px 80px rgba(0,0,0,.5); }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Интерфейс прототипа игры">
    <header class="topbar">
      <div class="topline">
        <div class="daybox">
          <strong>Понедельник</strong>
          <span>1 сентября</span>
        </div>
        <div class="clock" id="clock">08:10</div>
        <div class="money">
          <strong>24 500 ₽</strong>
          <span>деньги</span>
        </div>
      </div>

      <div class="weather">
        <span>☁️ +18° · прохладно</span>
        <div class="speed" aria-label="Скорость времени">
          <button data-speed="0" title="Пауза">Ⅱ</button>
          <button data-speed="1" class="active" title="Обычная скорость">▶</button>
          <button data-speed="4" title="Ускорение">▶▶</button>
        </div>
      </div>
    </header>

    <section class="scene">
      <div class="scene-art" aria-label="Двор старой пятиэтажки">
        <div class="sky-glow"></div>
        <div class="building"><div class="entrance"></div></div>
        <div class="tree"></div>
        <div class="scene-label">🏠 Двор дома</div>
        <div class="scene-hint">Утро · людей почти нет</div>
      </div>

      <div class="story">
        <div class="location-title">
          <h1 id="screenTitle">Твой новый дом</h1>
          <span id="screenMeta">Двор</span>
        </div>
        <p class="event-text" id="eventText">Ты стоишь во дворе старой пятиэтажки. Вещи уже занесены в квартиру. Дом живёт своей обычной утренней жизнью.</p>
        <div class="actions" id="actions">
          <button class="primary" id="talkBtn">Осмотреться</button>
          <button id="actionBtn">Зайти в подъезд</button>
        </div>
      </div>
    </section>

    <nav class="nav" aria-label="Главная навигация">
      <button class="active" data-tab="world"><span class="icon">🏠</span><span class="label">Мир</span></button>
      <button data-tab="phone"><span class="icon">📱</span><span class="label">Телефон</span></button>
      <button data-tab="map"><span class="icon">🗺️</span><span class="label">Карта</span></button>
      <button data-tab="me"><span class="icon">👤</span><span class="label">Я</span></button>
    </nav>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    let minutes = 8 * 60 + 10;
    let speed = 1;
    let timer = null;

    const clock = document.getElementById('clock');
    const eventText = document.getElementById('eventText');
    const screenTitle = document.getElementById('screenTitle');
    const screenMeta = document.getElementById('screenMeta');
    const toast = document.getElementById('toast');

    function renderTime() {
      const h = Math.floor(minutes / 60) % 24;
      const m = minutes % 60;
      clock.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function startClock() {
      clearInterval(timer);
      if (speed === 0) return;
      timer = setInterval(() => {
        minutes = (minutes + speed) % (24 * 60);
        renderTime();
      }, 1500);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    document.querySelectorAll('.speed button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.speed button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        speed = Number(btn.dataset.speed);
        startClock();
        showToast(speed === 0 ? 'Время поставлено на паузу' : speed === 1 ? 'Обычная скорость' : 'Время ускорено');
      });
    });

    const screens = {
      world: {
        title: 'Твой новый дом', meta: 'Двор',
        text: 'Ты стоишь во дворе старой пятиэтажки. Вещи уже занесены в квартиру. Дом живёт своей обычной утренней жизнью.'
      },
      phone: {
        title: 'Телефон', meta: 'Нет уведомлений',
        text: 'Контактов соседей пока нет. По мере знакомств здесь появятся сообщения, звонки и другие функции телефона.'
      },
      map: {
        title: 'Карта', meta: 'Район',
        text: 'Пока доступны дом, двор, магазин у дома и остановка. Переход между местами будет занимать игровое время.'
      },
      me: {
        title: 'Персонаж', meta: 'Состояние',
        text: 'Ты недавно переехал. Сейчас чувствуешь себя нормально, немного голоден и ещё не знаком с соседями.'
      }
    };

    document.querySelectorAll('.nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const data = screens[btn.dataset.tab];
        screenTitle.textContent = data.title;
        screenMeta.textContent = data.meta;
        eventText.textContent = data.text;
      });
    });

    document.getElementById('talkBtn').addEventListener('click', () => {
      eventText.textContent = 'У подъезда никого нет. На одной из площадок хлопает дверь, а из открытого окна слышно радио.';
      showToast('Наблюдение добавлено в журнал');
    });

    document.getElementById('actionBtn').addEventListener('click', () => {
      minutes += 2;
      renderTime();
      screenTitle.textContent = 'Подъезд';
      screenMeta.textContent = '1 этаж';
      eventText.textContent = 'Ты заходишь в подъезд. Пахнет старой краской и утренней едой. На стене висят почтовые ящики.';
      showToast('Прошло 2 минуты');
    });

    renderTime();
    startClock();
  </script>
</body>
</html>
