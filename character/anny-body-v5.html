<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090c12">
<title>Anny body v5 · silhouette toggle</title>
<style>html,body{margin:0;width:100%;height:100%;background:#090c12;color:#edf3ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:#aebbd0}</style>
</head>
<body>
<div class="boot" id="boot">Загрузка Anny v5…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./anny-body-v4.html?v=20260814-v5base',{cache:'no-store'});
    if(!r.ok)throw new Error('v4 '+r.status);
    let s=await r.text();

    s=s.replace('<title>Anny body v4 · gender + age</title>','<title>Anny body v5 · silhouette toggle</title>');
    s=s.replace('Anny · тело v4','Anny · тело v5');
    s=s.replace('<button id="wire">Сетка</button><button id="reset">Сброс</button>',
      '<button id="wire">Сетка</button><button id="technical" class="active">Тех. силуэт</button><button id="reset">Сброс</button>');
    s=s.replace('Пол и возраст теперь тоже меняют настоящую геометрию Anny/MakeHuman. Детский диапазон показывается как технический силуэт: пропорции и объём видны, анатомические детали скрыты.',
      'Пол и возраст меняют настоящую геометрию Anny/MakeHuman. Переключатель «Тех. силуэт» позволяет вручную включать плоский технический материал; при выключении младшие возрастные формы остаются в нейтральном 3D-материале для проверки геометрии.');

    s=s.replace(
      "const skinMat=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,metalness:0,side:THREE.DoubleSide});const silhouetteMat=new THREE.MeshBasicMaterial({color:0x69778d,side:THREE.DoubleSide});",
      "const skinMat=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,metalness:0,side:THREE.DoubleSide});const neutralMat=new THREE.MeshStandardMaterial({color:0x8995a8,roughness:.9,metalness:0,side:THREE.DoubleSide});const silhouetteMat=new THREE.MeshBasicMaterial({color:0x69778d,side:THREE.DoubleSide});"
    );
    s=s.replace(
      "let mesh=null,baseVerts=null,wire=false,radius=5,centerY=1,frontOffset=Math.PI,buildId=0,timer=0;const cache=new Map();",
      "let mesh=null,baseVerts=null,wire=false,technicalOn=true,radius=5,centerY=1,frontOffset=Math.PI,buildId=0,timer=0;const cache=new Map();"
    );
    s=s.replace(
      "const technical=+$('age').value<.66;mesh.material=technical?silhouetteMat:skinMat;mesh.material.wireframe=wire;fit(false);",
      "const minor=+$('age').value<.66,technical=technicalOn;mesh.material=technical?silhouetteMat:(minor?neutralMat:skinMat);mesh.material.wireframe=wire;fit(false);"
    );
    s=s.replace(
      "${technical?' · тех. силуэт':''}`;",
      "${technical?' · тех. силуэт':(minor?' · нейтр. 3D':'')}`;"
    );
    s=s.replace(
      "$('free').onclick=setFree;$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);if(mesh)mesh.material.wireframe=wire};$('reset').onclick=()=>{",
      "$('free').onclick=setFree;$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);if(mesh)mesh.material.wireframe=wire};$('technical').onclick=()=>{technicalOn=!technicalOn;$('technical').classList.toggle('active',technicalOn);if(mesh){const minor=+$('age').value<.66;mesh.material=technicalOn?silhouetteMat:(minor?neutralMat:skinMat);mesh.material.wireframe=wire}};$('reset').onclick=()=>{"
    );

    document.open();document.write(s);document.close();
  }catch(e){
    document.getElementById('boot').textContent='Ошибка загрузки v5: '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
