<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090c12">
<title>Anny female v2 · body only</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c12;color:#edf3ff}#stage{position:fixed;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%}.panel{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(720px,calc(100vw - 16px));padding:10px;border:1px solid #344057;border-radius:14px;background:#111722e8;backdrop-filter:blur(12px)}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.title{font-weight:850;font-size:14px;flex:1}.sub{width:100%;font-size:10px;line-height:1.35;color:#9daac0}button{border:1px solid #3d4961;border-radius:9px;background:#222b3c;color:#edf3ff;padding:7px 9px;font-weight:750;font-size:11px;white-space:nowrap}button.active{background:#425778;border-color:#9dbbec}.views{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.views button{padding:7px 2px}.status{position:fixed;z-index:5;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 11px;border:1px solid #344057;border-radius:10px;background:#111722e8;color:#b4c0d3;font-size:11px;max-width:calc(100vw - 16px);text-align:center}.status strong{color:#83d3ff}@media(max-width:560px){.panel{padding:8px}.title{font-size:12px}.sub{font-size:9px}.row button,.views button{font-size:10px;padding:6px 5px}}
</style>
</head>
<body>
<div id="stage"></div>
<section class="panel"><div class="row"><div class="title">Anny · BODY ONLY</div><button id="free" class="active">Свободно</button><button id="wire">Сетка</button><button id="reset">Сброс</button><div class="sub">Рендерится только OBJ-группа <b>body</b>. Все joint/helper-группы отброшены.</div></div><div class="views"><button data-view="0">Спереди</button><button data-view="1">П 3/4 →</button><button data-view="2">Справа</button><button data-view="3">З 3/4 →</button><button data-view="4">Сзади</button><button data-view="5">З 3/4 ←</button><button data-view="6">Слева</button><button data-view="7">П 3/4 ←</button></div></section>
<div class="status" id="status">Загрузка Anny body…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const BASE='https://raw.githubusercontent.com/naver/anny/main/src/anny/data/mpfb2/3dobjs/base.obj';
const TARGETS=['https://raw.githubusercontent.com/naver/anny/main/src/anny/data/mpfb2/targets/macrodetails/african-female-young.target.gz','https://raw.githubusercontent.com/naver/anny/main/src/anny/data/mpfb2/targets/macrodetails/asian-female-young.target.gz','https://raw.githubusercontent.com/naver/anny/main/src/anny/data/mpfb2/targets/macrodetails/caucasian-female-young.target.gz'];
const status=document.getElementById('status'),stage=document.getElementById('stage');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.setClearColor(0x090c12,1);stage.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;scene.add(new THREE.HemisphereLight(0xe7efff,0x16131d,2.4));const key=new THREE.DirectionalLight(0xffddc3,3.2);key.position.set(-4,7,5);scene.add(key);const fill=new THREE.DirectionalLight(0x8ab1ff,1.5);fill.position.set(5,3,-4);scene.add(fill);const grid=new THREE.GridHelper(4,24,0x34425a,0x1c2432);scene.add(grid);let mesh=null,wire=false,frontOffset=Math.PI,radius=5,centerY=1;
function parseBodyOBJ(text){const verts=[],indices=[];let group='';for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line||line[0]==='#')continue;if(line.startsWith('v ')){const p=line.split(/\s+/);verts.push(+p[1],+p[2],+p[3]);continue}if(line.startsWith('g ')){group=line.slice(2).trim();continue}if(group==='body'&&line.startsWith('f ')){const p=line.slice(2).trim().split(/\s+/).map(x=>parseInt(x.split('/')[0],10)-1);for(let i=1;i<p.length-1;i++)indices.push(p[0],p[i],p[i+1])}}return{verts:new Float32Array(verts),indices}}
async function gunzipText(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('target '+r.status);return await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text()}
function applyTarget(v,text,w){for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line||line[0]==='#')continue;const p=line.split(/\s+/);if(p.length<4)continue;const i=+p[0],o=i*3;if(o+2>=v.length)continue;v[o]+=+p[1]*w;v[o+1]+=+p[2]*w;v[o+2]+=+p[3]*w}}
async function load(){const r=await fetch(BASE,{cache:'force-cache'});if(!r.ok)throw new Error('base '+r.status);status.textContent='Читаю только группу body…';const parsed=parseBodyOBJ(await r.text());status.textContent='Применяю female-young morph…';try{const ts=await Promise.all(TARGETS.map(gunzipText));for(const t of ts)applyTarget(parsed.verts,t,1/3)}catch(e){console.warn(e)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(parsed.verts,3));g.setIndex(parsed.indices);g.computeVertexNormals();mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.9,side:THREE.DoubleSide}));scene.add(mesh);const box=new THREE.Box3().setFromObject(mesh),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());mesh.position.sub(center);mesh.position.y+=size.y/2;const b2=new THREE.Box3().setFromObject(mesh),s=b2.getSize(new THREE.Vector3());centerY=s.y*.52;radius=Math.max(s.y*1.65,s.x*3.1,s.z*3.1);controls.target.set(0,centerY,0);controls.minDistance=s.y*.65;controls.maxDistance=s.y*6;grid.scale.setScalar(Math.max(s.x,s.z)*.7);setView(0);setFree();status.innerHTML='<strong>Готово</strong> · только body · '+(parsed.indices.length/3).toLocaleString('ru-RU')+' треугольников'}
function setView(i){controls.enableRotate=false;document.getElementById('free').classList.remove('active');const a=frontOffset+i*Math.PI/4;camera.position.set(Math.sin(a)*radius,centerY+radius*.025,Math.cos(a)*radius);controls.target.set(0,centerY,0);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',+b.dataset.view===i))}function setFree(){controls.enableRotate=true;document.getElementById('free').classList.add('active');document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'))}function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(+b.dataset.view));document.getElementById('free').onclick=setFree;document.getElementById('reset').onclick=()=>{setView(0);setFree()};document.getElementById('wire').onclick=()=>{wire=!wire;document.getElementById('wire').classList.toggle('active',wire);if(mesh)mesh.material.wireframe=wire};addEventListener('resize',resize);resize();(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();load().catch(e=>{console.error(e);status.textContent='Ошибка: '+e.message});
</script></body></html>
