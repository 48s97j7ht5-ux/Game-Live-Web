<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090c12">
<title>Anny body v4 · gender + age</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c12;color:#edf3ff}#stage{position:fixed;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%}.panel{position:fixed;z-index:5;top:max(7px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(800px,calc(100vw - 14px));padding:9px;border:1px solid #344057;border-radius:14px;background:#111722eb;backdrop-filter:blur(12px);box-shadow:0 14px 40px #0008}.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.title{font-weight:850;font-size:14px;flex:1}.sub{width:100%;font-size:9px;line-height:1.3;color:#9daac0}button{border:1px solid #3d4961;border-radius:9px;background:#222b3c;color:#edf3ff;padding:6px 8px;font-weight:750;font-size:10px;white-space:nowrap}button.active{background:#425778;border-color:#9dbbec}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:7px}.ctrl{min-width:0;padding:6px;border:1px solid #2e394d;border-radius:10px;background:#151d2a}.ctrl .h{display:flex;justify-content:space-between;gap:5px;font-size:10px;font-weight:700;margin-bottom:3px}.ctrl output{color:#83d3ff;text-align:right}input[type=range]{width:100%;margin:0;accent-color:#82aeea}.ends{display:flex;justify-content:space-between;font-size:7px;color:#6f7c91;margin-top:1px}.views{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:7px}.views button{padding:6px 2px}.status{position:fixed;z-index:5;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 10px;border:1px solid #344057;border-radius:10px;background:#111722eb;color:#b4c0d3;font-size:10px;max-width:calc(100vw - 16px);text-align:center}.status strong{color:#83d3ff}@media(max-width:760px){.controls{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.title{font-size:12px}.controls{grid-template-columns:1fr 1fr}.views{grid-template-columns:repeat(4,1fr)}.panel{padding:7px}.sub{font-size:8px}}
</style>
</head><body>
<div id="stage"></div>
<section class="panel"><div class="top"><div class="title">Anny · тело v4</div><button id="free" class="active">Свободно</button><button id="wire">Сетка</button><button id="reset">Сброс</button><div class="sub">Пол и возраст теперь тоже меняют настоящую геометрию Anny/MakeHuman. Детский диапазон показывается как технический силуэт: пропорции и объём видны, анатомические детали скрыты.</div></div>
<div class="controls">
<div class="ctrl"><div class="h"><span>Пол</span><output id="genderVal">Ж 100%</output></div><input id="gender" type="range" min="0" max="1" step="0.01" value="0"><div class="ends"><span>Ж</span><span>М</span></div></div>
<div class="ctrl"><div class="h"><span>Возраст</span><output id="ageVal">Молодой</output></div><input id="age" type="range" min="0" max="1" step="0.01" value="0.66"><div class="ends"><span>младше</span><span>старше</span></div></div>
<div class="ctrl"><div class="h"><span>Рост</span><output id="heightVal">50</output></div><input id="height" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="ctrl"><div class="h"><span>Вес</span><output id="weightVal">50</output></div><input id="weight" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="ctrl"><div class="h"><span>Мышцы</span><output id="muscleVal">50</output></div><input id="muscle" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="ctrl"><div class="h"><span>Грудь</span><output id="cupVal">50</output></div><input id="cup" type="range" min="0" max="1" step="0.01" value="0.5"></div>
</div>
<div class="views"><button data-view="0">Спереди</button><button data-view="1">П 3/4 →</button><button data-view="2">Справа</button><button data-view="3">З 3/4 →</button><button data-view="4">Сзади</button><button data-view="5">З 3/4 ←</button><button data-view="6">Слева</button><button data-view="7">П 3/4 ←</button></div></section>
<div class="status" id="status">Загрузка базы…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const ROOT='https://raw.githubusercontent.com/naver/anny/main/src/anny/data/mpfb2',BASE=ROOT+'/3dobjs/base.obj',M=ROOT+'/targets/macrodetails',B=ROOT+'/targets/breast';
const $=id=>document.getElementById(id),status=$('status'),stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.setClearColor(0x090c12,1);stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.09;controls.enablePan=false;controls.minPolarAngle=.12;controls.maxPolarAngle=Math.PI-.12;
scene.add(new THREE.HemisphereLight(0xe7efff,0x16131d,2.25));let l=new THREE.DirectionalLight(0xffddc3,3.1);l.position.set(-4,7,5);scene.add(l);l=new THREE.DirectionalLight(0x8ab1ff,1.7);l.position.set(5,3,-4);scene.add(l);l=new THREE.DirectionalLight(0xd0a4ff,1.2);l.position.set(-4,4,-6);scene.add(l);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2,64),new THREE.MeshStandardMaterial({color:0x141b28,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(4,24,0x34425a,0x1c2432);grid.position.y=.003;grid.material.transparent=true;grid.material.opacity=.38;scene.add(grid);
const skinMat=new THREE.MeshStandardMaterial({color:0xd8a88f,roughness:.88,metalness:0,side:THREE.DoubleSide});const silhouetteMat=new THREE.MeshBasicMaterial({color:0x69778d,side:THREE.DoubleSide});
let mesh=null,baseVerts=null,wire=false,radius=5,centerY=1,frontOffset=Math.PI,buildId=0,timer=0;const cache=new Map();
function parseOBJ(t){const v=[],idx=[];let body=false;for(const raw of t.split(/\r?\n/)){const s=raw.trim();if(!s||s[0]==='#')continue;if(s.startsWith('g ')){body=s.slice(2).trim()==='body';continue}if(s.startsWith('v ')){const p=s.split(/\s+/);v.push(+p[1],+p[2],+p[3])}else if(body&&s.startsWith('f ')){const p=s.slice(2).trim().split(/\s+/).map(x=>parseInt(x.split('/')[0])-1);for(let i=1;i<p.length-1;i++)idx.push(p[0],p[i],p[i+1])}}return{v:new Float32Array(v),idx}}
async function gz(url,optional=false){if(cache.has(url))return cache.get(url);const p=(async()=>{const r=await fetch(url,{cache:'force-cache'});if(!r.ok){if(optional&&r.status===404)return null;throw Error(r.status+' '+url.split('/').pop())}const ds=new DecompressionStream('gzip');return new Response(r.body.pipeThrough(ds)).text()})();cache.set(url,p);return p}
function add(v,t,w){if(!t||w<=0)return;for(const raw of t.split(/\r?\n/)){const p=raw.trim().split(/\s+/);if(p.length<4||p[0][0]==='#')continue;const i=+p[0]*3;if(i+2>=v.length)continue;v[i]+=+p[1]*w;v[i+1]+=+p[2]*w;v[i+2]+=+p[3]*w}}
function tri(x,n){return x<=.5?[[n[0],1-x*2],[n[1],x*2]].filter(a=>a[1]>1e-6):[[n[1],2-x*2],[n[2],x*2-1]].filter(a=>a[1]>1e-6)}function bi(x,n){return[[n[0],1-x],[n[1],x]].filter(a=>a[1]>1e-6)}
function ageBlend(x){const pts=[[0,'baby'],[.33,'child'],[.66,'young'],[1,'old']];if(x<=pts[0][0])return[[pts[0][1],1]];for(let i=0;i<pts.length-1;i++){const[a,an]=pts[i],[b,bn]=pts[i+1];if(x<=b){const t=(x-a)/(b-a);return[[an,1-t],[bn,t]].filter(q=>q[1]>1e-6)}}return[['old',1]]}
function ageName(x){if(x<.165)return'Младенец';if(x<.495)return'Ребёнок';if(x<.83)return'Молодой';return'Пожилой'}
async function target(url,v,w,opt=false){if(w<=1e-6)return;add(v,await gz(url,opt),w)}
function updateLabels(){const g=+$('gender').value,a=+$('age').value;$('genderVal').value=g<.5?`Ж ${Math.round((1-g)*100)}%`:`М ${Math.round(g*100)}%`;$('ageVal').value=ageName(a);for(const k of['height','weight','muscle','cup'])$(k+'Val').value=Math.round(+$(k).value*100)}
async function rebuild(){if(!mesh||!baseVerts)return;const id=++buildId;updateLabels();status.textContent='Пересобираю тело…';const v=new Float32Array(baseVerts),gg=bi(+$('gender').value,['female','male']),aa=ageBlend(+$('age').value),mw=tri(+$('muscle').value,['minmuscle','averagemuscle','maxmuscle']),ww=tri(+$('weight').value,['minweight','averageweight','maxweight']),hh=bi(+$('height').value,['minheight','maxheight']),cc=tri(+$('cup').value,['mincup','averagecup','maxcup']);
try{
for(const[g,wg]of gg)for(const[a,wa]of aa){const ga=wg*wa;for(const r of['african','asian','caucasian'])await target(`${M}/${r}-${g}-${a}.target.gz`,v,ga/3,true);for(const[m,wm]of mw)for(const[w,wwt]of ww){const q=ga*wm*wwt;await target(`${M}/universal-${g}-${a}-${m}-${w}.target.gz`,v,q,true);for(const[h,wh]of hh)await target(`${M}/height/${g}-${a}-${m}-${w}-${h}.target.gz`,v,q*wh,true);await target(`${M}/proportions/${g}-${a}-${m}-${w}-idealproportions.target.gz`,v,q*.5,true);await target(`${M}/proportions/${g}-${a}-${m}-${w}-uncommonproportions.target.gz`,v,q*.5,true);if(g==='female'&&(a==='young'||a==='old'))for(const[c,wc]of cc)await target(`${B}/female-${a}-${m}-${w}-${c}-averagefirmness.target.gz`,v,q*wc,true)}}
if(id!==buildId)return;mesh.geometry.attributes.position.array.set(v);mesh.geometry.attributes.position.needsUpdate=true;mesh.geometry.computeVertexNormals();const technical=+$('age').value<.66;mesh.material=technical?silhouetteMat:skinMat;mesh.material.wireframe=wire;fit(false);const pct=k=>Math.round(+$(`${k}`).value*100),g=+$('gender').value;status.innerHTML=`<strong>Готово</strong> · пол ${g<.5?'Ж':'М'} ${Math.round((g<.5?1-g:g)*100)}% · возраст ${ageName(+$('age').value)} · рост ${pct('height')} · вес ${pct('weight')} · мышцы ${pct('muscle')} · грудь ${pct('cup')}${technical?' · тех. силуэт':''}`;
}catch(e){console.error(e);status.textContent='Ошибка target: '+e.message}}
function fit(first){mesh.position.set(0,0,0);let b=new THREE.Box3().setFromObject(mesh),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());mesh.position.set(-c.x,-b.min.y,-c.z);b=new THREE.Box3().setFromObject(mesh);s=b.getSize(new THREE.Vector3());centerY=s.y*.52;controls.target.set(0,centerY,0);if(first){radius=Math.max(s.y*1.65,s.x*3.1,s.z*3.1);controls.minDistance=s.y*.65;controls.maxDistance=s.y*6;floor.scale.setScalar(Math.max(s.x,s.z)*.7);grid.scale.setScalar(Math.max(s.x,s.z)*.7);setView(0);setFree()}controls.update()}
function setView(i){controls.enableRotate=false;$('free').classList.remove('active');const a=frontOffset+i*Math.PI/4;camera.position.set(Math.sin(a)*radius,centerY+radius*.025,Math.cos(a)*radius);controls.target.set(0,centerY,0);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',+b.dataset.view===i))}function setFree(){controls.enableRotate=true;$('free').classList.add('active');document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'))}
async function load(){const r=await fetch(BASE,{cache:'force-cache'});if(!r.ok)throw Error('base '+r.status);const p=parseOBJ(await r.text());baseVerts=new Float32Array(p.v);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(baseVerts),3));g.setIndex(p.idx);g.computeVertexNormals();mesh=new THREE.Mesh(g,skinMat);scene.add(mesh);fit(true);await rebuild()}
for(const k of['gender','age','height','weight','muscle','cup']){$(k).oninput=()=>{updateLabels();clearTimeout(timer);timer=setTimeout(rebuild,80)}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(+b.dataset.view));$('free').onclick=setFree;$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);if(mesh)mesh.material.wireframe=wire};$('reset').onclick=()=>{$('gender').value=0;$('age').value=.66;for(const k of['height','weight','muscle','cup'])$(k).value=.5;updateLabels();rebuild()};function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();updateLabels();(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();load().catch(e=>{console.error(e);status.textContent='Ошибка загрузки: '+e.message});
</script></body></html>
