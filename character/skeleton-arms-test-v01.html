<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Skeleton v1.3 · Arms Test</title><link rel="stylesheet" href="./skeleton-v09.css?v=20260812-1422"><style>.metrics-toggle{position:fixed;z-index:6;right:max(12px,env(safe-area-inset-right));bottom:max(84px,calc(env(safe-area-inset-bottom) + 64px));padding:7px 10px}.metrics-toggle.open{bottom:auto;top:max(118px,calc(env(safe-area-inset-top) + 106px))}.metrics.collapsed{display:none}.mechanics-panel{position:fixed;z-index:9;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:min(380px,calc(100vw - 24px));padding:12px;background:rgba(18,22,31,.94);border:1px solid #30384a;border-radius:12px;color:#e9edf6;font:12px/1.35 system-ui,-apple-system,sans-serif;backdrop-filter:blur(12px)}.mechanics-panel h3{margin:0 0 10px;font-size:14px}.control-row{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;margin:8px 0}.control-row input{width:100%}.value{text-align:right;font-variant-numeric:tabular-nums}.mechanics-actions{display:flex;gap:8px;align-items:center;margin-top:10px}.mechanics-actions button{padding:7px 10px}.mechanics-status{font-size:11px;opacity:.8}@media(max-width:640px){.mechanics-panel{font-size:11px}.control-row{grid-template-columns:82px 1fr 40px}}</style></head><body><div id="app"></div><div class="hud"><div class="panel info"><div class="title">Skeleton v1.3 · Arms</div><div class="sub">native shoulder → elbow → wrist → hand<br>зелёный/голубой = debug rig</div></div><div class="panel controls-panel"><div class="buttons"><button data-view="front">Спереди</button><button data-view="side">Сбоку</button><button data-view="back">Сзади</button><button data-view="threequarter">3/4</button></div><div class="buttons second"><button data-labels>Подписи</button></div></div></div><button id="toggleMetrics" class="metrics-toggle open" type="button" aria-expanded="true">Диагностика ▾</button><div id="metrics" class="panel metrics"></div><div id="labels"></div><div class="panel legend"><span class="dot bone"></span>кость <span class="dot joint"></span>сустав <span class="dot frame"></span>каркас</div><div class="mechanics-panel"><h3>Левая рука · Contract v1</h3><label class="control-row"><span>Плечо вперёд</span><input id="shoulderFlexion" type="range" min="-40" max="180" value="0" step="1"><span id="shoulderFlexionValue" class="value">0°</span></label><label class="control-row"><span>Плечо вбок</span><input id="shoulderAbduction" type="range" min="-40" max="180" value="0" step="1"><span id="shoulderAbductionValue" class="value">0°</span></label><label class="control-row"><span>Локоть</span><input id="elbowFlexion" type="range" min="0" max="150" value="0" step="1"><span id="elbowFlexionValue" class="value">0°</span></label><label class="control-row"><span>Кисть</span><input id="wristFlexion" type="range" min="-80" max="80" value="0" step="1"><span id="wristFlexionValue" class="value">0°</span></label><div class="mechanics-actions"><button id="resetMechanics" type="button">Сброс</button><span id="mechanicsStatus" class="mechanics-status">Инициализация…</span></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module" src="./skeleton-arms-test-v01.js?v=20260812-1739"></script><script>const tm=document.getElementById('toggleMetrics'),mp=document.getElementById('metrics');tm.addEventListener('click',()=>{const c=mp.classList.toggle('collapsed');tm.classList.toggle('open',!c);tm.setAttribute('aria-expanded',String(!c));tm.textContent=c?'Диагностика ▴':'Диагностика ▾';});</script></body></html>
