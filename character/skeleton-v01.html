<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Character Engine — Skeleton v0.1</title>
  <link rel="stylesheet" href="./skeleton-v01.css" />
</head>
<body>
  <div id="app"></div>

  <div class="hud">
    <div class="panel info">
      <div class="title">Skeleton v0.1</div>
      <div class="sub">Параметрический взрослый скелет<br>Пальцем: вращение · двумя: масштаб</div>
    </div>
    <div class="panel buttons">
      <button data-pose="neutral">Стойка</button>
      <button data-pose="relaxed">Свободно</button>
      <button data-pose="step">Шаг</button>
    </div>
  </div>

  <div class="panel legend">
    <span class="dot" style="background:#d7dbe7"></span>кость
    <span class="dot" style="background:#f0a65b"></span>сустав
    <span class="dot" style="background:#7cc7ff"></span>конец
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./skeleton-v01.js"></script>
</body>
</html>
