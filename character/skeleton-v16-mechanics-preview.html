<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Skeleton v1.6 · Full Mechanics</title><link rel="stylesheet" href="./skeleton-v09.css"><style>
.mechanics-panel{position:fixed;z-index:9;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));width:min(420px,calc(100vw - 20px));max-height:min(72vh,760px);overflow:auto;padding:12px;background:rgba(18,22,31,.95);border:1px solid #30384a;border-radius:12px;color:#e9edf6;font:12px/1.35 system-ui,-apple-system,sans-serif;backdrop-filter:blur(12px)}
.mechanics-panel h3{margin:0;font-size:14px}.mechanics-head{display:flex;align-items:center;gap:8px;position:sticky;top:-12px;background:#12161f;padding:10px 0 8px;z-index:2}.mechanics-head select{margin-left:auto;background:#222938;color:#fff;border:1px solid #3a455b;border-radius:7px;padding:5px}
.mechanics-panel details{border-top:1px solid #30384a;padding:7px 0}.mechanics-panel summary{cursor:pointer;font-weight:650;color:#cfd9ef}.control-row{display:grid;grid-template-columns:125px 1fr 42px;gap:7px;align-items:center;margin:6px 0}.control-row input{width:100%}.value{text-align:right;font-variant-numeric:tabular-nums}.mechanics-actions{display:flex;gap:8px;align-items:center;position:sticky;bottom:-12px;background:#12161f;padding:8px 0 10px}.mechanics-actions button{padding:7px 10px}.mechanics-status{font-size:11px;opacity:.82}.metrics-toggle{position:fixed;z-index:6;right:max(12px,env(safe-area-inset-right));bottom:max(84px,calc(env(safe-area-inset-bottom) + 64px));padding:7px 10px}.metrics-toggle.open{bottom:auto;top:max(118px,calc(env(safe-area-inset-top) + 106px))}.metrics.collapsed{display:none}
@media(max-width:640px){.mechanics-panel{font-size:11px;max-height:55vh}.control-row{grid-template-columns:106px 1fr 38px}.legend{display:none}}
</style></head><body><div id="app"></div><div class="hud"><div class="panel info"><div class="title">Skeleton v1.6 · Full Mechanics</div><div class="sub">Mechanics 2.1 · обычный взрослый<br>активные пределы · связанные ограничения</div></div><div class="panel controls-panel"><div class="buttons"><button data-view="front">Спереди</button><button data-view="side">Сбоку</button><button data-view="back">Сзади</button><button data-view="threequarter">3/4</button></div><div class="buttons second"><button data-labels>Подписи</button></div></div></div><button id="toggleMetrics" class="metrics-toggle open" type="button" aria-expanded="true">Диагностика ▾</button><div id="metrics" class="panel metrics"></div><div id="labels"></div><div class="panel legend"><span class="dot bone"></span>кость <span class="dot joint"></span>сустав <span class="dot frame"></span>каркас</div>
<div class="mechanics-panel"><div class="mechanics-head"><h3>Полная подвижность</h3><select id="mechanicsSide"><option value="L">Левая сторона</option><option value="R">Правая сторона</option></select></div><details open><summary>Рука и кисть</summary><div id="armControls"></div></details><details><summary>Нога и стопа</summary><div id="legControls"></div></details><details><summary>Таз, позвоночник и шея</summary><div id="torsoControls"></div></details><details><summary>Нижняя челюсть</summary><div id="jawControls"></div></details><div class="mechanics-actions"><button id="resetMechanics" type="button">Сброс</button><button id="groundMechanics" type="button">На пол</button><span id="mechanicsStatus" class="mechanics-status">Инициализация…</span></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module" src="./skeleton-v16-mechanics-preview.js?v=20260813-full1"></script><script>const tm=document.getElementById('toggleMetrics'),mp=document.getElementById('metrics');tm.addEventListener('click',()=>{const c=mp.classList.toggle('collapsed');tm.classList.toggle('open',!c);tm.setAttribute('aria-expanded',String(!c));tm.textContent=c?'Диагностика ▴':'Диагностика ▾';});</script></body></html>
