<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090c12">
<title>Anny female v1 debug · all OBJ groups</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c12;color:#edf3ff}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.panel{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));left:8px;width:min(390px,calc(100vw - 16px));max-height:calc(100vh - 16px - env(safe-area-inset-top));display:flex;flex-direction:column;border:1px solid #344057;border-radius:14px;background:#111722ee;box-shadow:0 16px 45px #0009;backdrop-filter:blur(12px);overflow:hidden}.head{padding:10px;border-bottom:1px solid #2c374b}.title{font-size:14px;font-weight:850}.sub{font-size:10px;color:#9daac0;line-height:1.35;margin-top:4px}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px;border-bottom:1px solid #2c374b}button{border:1px solid #3d4961;border-radius:8px;background:#222b3c;color:#edf3ff;padding:6px 8px;font-size:10px;font-weight:750}button.active{background:#425778;border-color:#9dbbec}.search{padding:7px 8px;border-bottom:1px solid #2c374b}.search input{width:100%;border:1px solid #344057;border-radius:8px;background:#0c121c;color:#edf3ff;padding:7px 9px;font-size:11px}.groups{overflow:auto;padding:6px 8px 10px;flex:1}.groupRow{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 3px;border-bottom:1px solid #1f2938}.groupRow.hiddenBySearch{display:none}.groupRow input{width:16px;height:16px}.groupName{font-size:10px;word-break:break-all}.tag{font-size:9px;padding:2px 5px;border-radius:999px;background:#1d2940;color:#b8c9e6;border:1px solid #314564}.views{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px;border-top:1px solid #2c374b}.views button{padding:6px 2px}.status{position:fixed;z-index:4;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-width:min(520px,calc(100vw - 16px));padding:7px 9px;border:1px solid #344057;border-radius:10px;background:#111722dd;color:#b4c0d3;font-size:10px;text-align:right}.status strong{color:#83d3ff}@media(max-width:620px){.panel{width:min(340px,calc(100vw - 12px));left:6px;max-height:62vh}.status{left:6px;right:auto;text-align:left}.title{font-size:12px}}
</style>
</head>
<body>
<div id="stage"></div>
<section class="panel">
  <div class="head"><div class="title">Anny v1 · ВСЕ группы base.obj</div><div class="sub">Каждая строка — отдельная OBJ-группа. Снимай галочки по одной и смотри, что исчезает.</div></div>
  <div class="toolbar"><button id="allOn">Все ON</button><button id="allOff">Все OFF</button><button id="onlyBody">Только body</button><button id="onlyHelpers">Helpers</button><button id="onlyJoints">Joints</button><button id="wire">Сетка</button><button id="free" class="active">Свободно</button><button id="reset">Сброс</button></div>
  <div class="search"><input id="search" placeholder="Поиск группы: body, helper, joint…"></div>
  <div class="groups" id="groups"></div>
  <div class="views"><button data-view="0">Спереди</button><button data-view="1">П 3/4 →</button><button data-view="2">Справа</button><button data-view="3">З 3/4 →</button><button data-view="4">Сзади</button><button data-view="5">З 3/4 ←</button><button data-view="6">Слева</button><button data-view="7">П 3/4 ←</button></div>
</section>
<div class="status" id="status">Загрузка OBJ…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const OBJ_URL='https://raw.githubusercontent.com/naver/anny/main/src/anny/data/mpfb2/3dobjs/base.obj';
const $=id=>document.getElementById(id),stage=$('stage'),status=$('status'),groupsEl=$('groups');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0x090c12,1);stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x090c12,6,15);const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.01,100);const controls=new OrbitControls(camera,stage);controls.enableDamping=true;controls.dampingFactor=.09;controls.enablePan=false;controls.minPolarAngle=.18;controls.maxPolarAngle=Math.PI-.18;
scene.add(new THREE.HemisphereLight(0xdbe8ff,0x17131c,2.2));const key=new THREE.DirectionalLight(0xffe0c2,3.1);key.position.set(-4,7,5);scene.add(key);const fill=new THREE.DirectionalLight(0x87aaff,1.8);fill.position.set(5,3,-4);scene.add(fill);const rim=new THREE.DirectionalLight(0xb98cff,1.25);rim.position.set(-4,5,-6);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.1,64),new THREE.MeshStandardMaterial({color:0x151c29,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(4.2,28,0x334057,0x1b2331);grid.position.y=.006;grid.material.transparent=true;grid.material.opacity=.43;scene.add(grid);
const root=new THREE.Group();scene.add(root);const items=[];let wire=false,frontOffset=Math.PI,radius=5,centerY=1;
function resize(){camera.aspect=Math.max(.35,innerWidth/innerHeight);camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false)}addEventListener('resize',resize);resize();
function parseOBJ(text){const verts=[],groups=new Map();let current='default';groups.set(current,[]);for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line||line[0]==='#')continue;if(line.startsWith('v ')){const p=line.split(/\s+/);verts.push([+p[1],+p[2],+p[3]]);continue}if(line.startsWith('g ')){current=line.slice(2).trim()||'default';if(!groups.has(current))groups.set(current,[]);continue}if(line.startsWith('f ')){const ids=line.slice(2).trim().split(/\s+/).map(t=>parseInt(t.split('/')[0],10)-1),bucket=groups.get(current);for(let i=1;i<ids.length-1;i++)bucket.push([ids[0],ids[i],ids[i+1]])}}return{verts,groups}}
function geom(faces,verts){const a=[];for(const tri of faces)for(const i of tri){const p=verts[i];if(p)a.push(p[0],p[1],p[2])}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));g.computeVertexNormals();return g}
function kind(name){if(name==='body')return'body';if(name.startsWith('joint-'))return'joint';if(name.startsWith('helper-'))return'helper';return'other'}
function matFor(k){const c=k==='body'?0xd8a88f:k==='joint'?0xe6c86e:k==='helper'?0x6fc0ff:0xc48cff;return new THREE.MeshStandardMaterial({color:c,roughness:.86,side:THREE.DoubleSide})}
function fit(){const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());root.position.sub(center);root.position.y+=size.y/2;centerY=size.y*.52;radius=Math.max(size.y*1.85,size.x*3.2,size.z*3.2);floor.scale.setScalar(Math.max(size.x,size.z)*.7);grid.scale.setScalar(Math.max(size.x,size.z)*.7);controls.minDistance=size.y*.72;controls.maxDistance=size.y*7;controls.target.set(0,centerY,0);scene.fog.near=radius*1.15;scene.fog.far=radius*3.1;setView(0);setFree()}
function cameraAt(angle,e=.08){const current=((Math.round((angle-frontOffset)/(Math.PI/4))%8)+8)%8;controls.enableRotate=false;$('free').classList.remove('active');camera.position.set(Math.sin(angle)*radius,centerY+radius*e,Math.cos(angle)*radius);controls.target.set(0,centerY,0);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',+b.dataset.view===current))}function setView(i){cameraAt(frontOffset+i*Math.PI/4)}function setFree(){controls.enableRotate=true;$('free').classList.add('active');document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'))}
function updateStatus(){const on=items.filter(x=>x.mesh.visible).length;status.innerHTML=`<strong>${items.length} групп</strong> · включено ${on}`}
function setWhere(fn,v){items.forEach(x=>{if(fn(x)){x.mesh.visible=v;x.cb.checked=v}});updateStatus()}
function onlyKind(k){items.forEach(x=>{const v=x.kind===k;x.mesh.visible=v;x.cb.checked=v});updateStatus()}
function createRow(item){const row=document.createElement('label');row.className='groupRow';row.dataset.name=item.name.toLowerCase();const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.onchange=()=>{item.mesh.visible=cb.checked;updateStatus()};const n=document.createElement('span');n.className='groupName';n.textContent=item.name;const tag=document.createElement('span');tag.className='tag';tag.textContent=item.kind;row.append(cb,n,tag);item.cb=cb;item.row=row;groupsEl.appendChild(row)}
$('allOn').onclick=()=>setWhere(()=>true,true);$('allOff').onclick=()=>setWhere(()=>true,false);$('onlyBody').onclick=()=>onlyKind('body');$('onlyHelpers').onclick=()=>onlyKind('helper');$('onlyJoints').onclick=()=>onlyKind('joint');$('wire').onclick=()=>{wire=!wire;items.forEach(x=>x.mesh.material.wireframe=wire);$('wire').classList.toggle('active',wire)};$('free').onclick=setFree;$('reset').onclick=()=>{setWhere(()=>true,true);wire=false;items.forEach(x=>x.mesh.material.wireframe=false);$('wire').classList.remove('active');setView(0);setFree()};$('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();items.forEach(x=>x.row.classList.toggle('hiddenBySearch',q&&!x.name.toLowerCase().includes(q)))};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(+b.dataset.view));
fetch(OBJ_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('OBJ '+r.status);return r.text()}).then(text=>{const parsed=parseOBJ(text);for(const [name,faces] of parsed.groups){if(!faces.length)continue;const k=kind(name),mesh=new THREE.Mesh(geom(faces,parsed.verts),matFor(k));root.add(mesh);const item={name,kind:k,mesh,cb:null,row:null};items.push(item);createRow(item)}items.sort((a,b)=>a.name.localeCompare(b.name));items.forEach(x=>groupsEl.appendChild(x.row));fit();updateStatus()}).catch(e=>{console.error(e);status.textContent='Не удалось загрузить base.obj'});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>
