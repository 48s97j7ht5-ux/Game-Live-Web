<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Quaternius inspector v1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f16;color:#eef4ff;font-family:system-ui,-apple-system,sans-serif}#stage{position:fixed;inset:0 330px 0 0;touch-action:none}#side{position:fixed;right:0;top:0;width:330px;height:100%;background:#111826;border-left:1px solid #2b3850;display:flex;flex-direction:column}.head{padding:10px;border-bottom:1px solid #2b3850}.title{font-weight:800}.sub{font-size:11px;color:#9eabc0;margin-top:4px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-bottom:1px solid #2b3850}button,input{border:1px solid #3a4964;border-radius:8px;background:#202a3b;color:#eef4ff;padding:8px;font:inherit}#search{margin:8px;width:calc(100% - 16px);background:#0d1420}.list{flex:1;overflow:auto;padding:8px}.row{padding:7px;border:1px solid #26344b;border-radius:8px;margin-bottom:6px;background:#0e1521}.row label{display:flex;gap:7px;align-items:flex-start}.name{font-size:12px;font-weight:700;word-break:break-word}.meta{font-size:10px;color:#91a2ba;margin-top:3px;word-break:break-word}.status{position:fixed;left:10px;bottom:10px;background:#111826e8;border:1px solid #2b3850;border-radius:8px;padding:7px 9px;font-size:11px}@media(max-width:800px){#stage{inset:0 0 48% 0}#side{top:auto;bottom:0;width:100%;height:48%;border-left:0;border-top:1px solid #2b3850}}</style></head><body><div id="stage"></div><aside id="side"><div class="head"><div class="title">Quaternius · mesh inspector</div><div class="sub">Щёлкай части модели по одной — сразу увидим, что там отдельными mesh'ами.</div></div><div class="tools"><button id="allOn">Показать всё</button><button id="allOff">Скрыть всё</button><button id="bodyOnly">Только body*</button><button id="clothesOff">Без одежды*</button></div><input id="search" placeholder="поиск по имени"><div class="list" id="list"></div></aside><div class="status" id="status">Загрузка…</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const URL='https://raw.githubusercontent.com/hukasu/bevy-modular-characters/b84c33822779c827fec2074edbfe98c4ddafb0e5/assets/Adventurer.gltf';const stage=document.getElementById('stage'),list=document.getElementById('list'),status=document.getElementById('status'),search=document.getElementById('search');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setClearColor(0x0b0f16);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;scene.add(new THREE.HemisphereLight(0xdde7ff,0x17131b,2.4));let l=new THREE.DirectionalLight(0xffe3c6,3);l.position.set(-4,6,5);scene.add(l);l=new THREE.DirectionalLight(0x88aaff,1.6);l.position.set(5,3,-4);scene.add(l);const floor=new THREE.Mesh(new THREE.CircleGeometry(2.2,64),new THREE.MeshStandardMaterial({color:0x151d2a,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(4.4,28,0x334057,0x1b2331);grid.position.y=.005;scene.add(grid);let items=[];function fit(){const b=new THREE.Box3().setFromObject(scene.getObjectByName('MODEL')),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=scene.getObjectByName('MODEL');m.position.sub(c);m.position.y+=s.y/2;const cy=s.y*.52,r=Math.max(s.y*1.9,s.x*3,s.z*3);camera.position.set(0,cy,r);controls.target.set(0,cy,0);controls.minDistance=s.y*.7;controls.maxDistance=s.y*7;controls.update()}function refresh(){const q=search.value.toLowerCase();list.innerHTML='';for(const it of items){if(q&&!it.name.toLowerCase().includes(q)&&!it.path.toLowerCase().includes(q))continue;const row=document.createElement('div');row.className='row';const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=it.o.visible;cb.onchange=()=>it.o.visible=cb.checked;const box=document.createElement('div');box.innerHTML=`<div class="name">${it.name||'(без имени)'}</div><div class="meta">${it.o.type}<br>${it.path}<br>verts: ${it.verts} · tris: ${it.tris}<br>material: ${it.mat}</div>`;lab.append(cb,box);row.append(lab);list.append(row)}}function setAll(v){items.forEach(i=>i.o.visible=v);refresh()}document.getElementById('allOn').onclick=()=>setAll(true);document.getElementById('allOff').onclick=()=>setAll(false);document.getElementById('bodyOnly').onclick=()=>{items.forEach(i=>i.o.visible=/body|skin|head|torso|arm|leg|hand|foot|pelvis|hip|breast/i.test(i.name));refresh()};document.getElementById('clothesOff').onclick=()=>{items.forEach(i=>i.o.visible=!/shirt|top|pant|skirt|dress|cloth|shoe|boot|sock|glove|belt|cape|coat|jacket|hair|hat|hood|armor/i.test(i.name));refresh()};search.oninput=refresh;new GLTFLoader().load(URL,g=>{const root=g.scene;root.name='MODEL';scene.add(root);root.traverse(o=>{if(!o.isMesh)return;const p=[];for(let x=o;x&&x!==root.parent;x=x.parent)p.unshift(x.name||x.type);const a=o.geometry?.attributes?.position?.count||0;const t=o.geometry?.index?Math.floor(o.geometry.index.count/3):Math.floor(a/3);const mats=(Array.isArray(o.material)?o.material:[o.material]).map(m=>m?.name||'(без имени)').join(', ');items.push({o,name:o.name||'(без имени)',path:p.join(' / '),verts:a,tris:t,mat:mats})});fit();refresh();status.textContent='Готово · mesh: '+items.length},p=>{if(p.total)status.textContent='Загрузка '+Math.round(p.loaded/p.total*100)+'%'},e=>{console.error(e);status.textContent='Ошибка загрузки модели'});function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})()</script></body></html>
