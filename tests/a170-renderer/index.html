<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A170 Master Cut v0.1</title><style>body{margin:0;background:#101317;color:#eef2f7;font-family:system-ui;padding:14px}h1{font-size:18px;margin:0 0 6px}.wrap{max-width:980px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#161b22;border:1px solid #303945;border-radius:12px;padding:10px}.stage{background:linear-gradient(45deg,#242b34 25%,transparent 25%) 0 0/16px 16px,linear-gradient(45deg,transparent 75%,#242b34 75%) 0 0/16px 16px,linear-gradient(45deg,transparent 75%,#242b34 75%) 8px -8px/16px 16px,linear-gradient(45deg,#242b34 25%,#1b2027 25%) 8px 8px/16px 16px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}button{background:#222a34;color:white;border:1px solid #46515f;border-radius:8px;padding:8px 10px;margin:3px}.small{font-size:12px;color:#aeb8c4}.ok{color:#7ee787}.controls{margin-top:10px}.layers{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px;align-items:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>A170 — real Master Cut v0.1</h1><p class="small">Слева — один цельный master. Справа — реконструкция из перекрывающихся областей этого же изображения. Никакой перерисовки.</p><div class="grid"><div class="card"><b>Master</b><div class="stage"><canvas id="master" width="375" height="400"></canvas></div></div><div class="card"><b>Reconstruction</b><div class="stage"><canvas id="recon" width="375" height="400"></canvas></div><div class="controls"><button id="allOn">Все слои</button><button id="allOff">Выключить</button><button id="compare">Сравнить</button></div></div></div><div class="card" style="margin-top:12px"><b>Слои</b><div id="layers" class="layers"></div><p id="status" class="small"></p></div></div><script>const src='assets/master_compact.png';const cuts={abdomen_surface:[94,0,177,115],pelvis_structural:[94,38,177,154],thigh_L_structural:[106,61,81,170],knee_L_surface:[114,160,67,83],lowerLeg_L_structural:[117,195,64,160],foot_L_structural:[120,311,63,88]};const order=['pelvis_structural','thigh_L_structural','lowerLeg_L_structural','abdomen_surface','knee_L_surface','foot_L_structural'];const state=Object.fromEntries(order.map(k=>[k,true]));const img=new Image();const mc=document.getElementById('master'),mctx=mc.getContext('2d'),rc=document.getElementById('recon'),rctx=rc.getContext('2d');mctx.imageSmoothingEnabled=false;rctx.imageSmoothingEnabled=false;function render(){mctx.clearRect(0,0,375,400);rctx.clearRect(0,0,375,400);mctx.drawImage(img,0,0);for(const k of order){if(!state[k])continue;const [x,y,w,h]=cuts[k];rctx.drawImage(img,x,y,w,h,x,y,w,h)}document.getElementById('status').innerHTML='<span class="ok">Real master loaded.</span> Active: '+order.filter(k=>state[k]).join(', ')}const box=document.getElementById('layers');for(const k of order){const l=document.createElement('label');l.textContent=k;const c=document.createElement('input');c.type='checkbox';c.checked=true;c.onchange=()=>{state[k]=c.checked;render()};box.append(l,c)}document.getElementById('allOn').onclick=()=>{order.forEach(k=>state[k]=true);document.querySelectorAll('#layers input').forEach(c=>c.checked=true);render()};document.getElementById('allOff').onclick=()=>{order.forEach(k=>state[k]=false);document.querySelectorAll('#layers input').forEach(c=>c.checked=false);render()};document.getElementById('compare').onclick=()=>{order.forEach(k=>state[k]=true);document.querySelectorAll('#layers input').forEach(c=>c.checked=true);render()};img.onload=render;img.onerror=()=>document.getElementById('status').textContent='Ошибка загрузки master_compact.png';img.src=src+'?v=2';</script></body></html>
